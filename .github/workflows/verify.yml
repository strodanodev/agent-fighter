name: verify

# The guardrails only work if they run automatically. This runs the same
# `npm run verify` gate on every push/PR — typecheck (all packages) + full
# test suite (gameplay + determinism + golden replay + invariant guards).
# A red run = the change broke a contract; do not merge.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run verify

  # Browser-vs-Node golden determinism (audit 2026-07-18 carried gate). The
  # money path assumes a match simulated in a player's browser re-simulates
  # bit-identically on the Node server; this asserts it in Chromium AND WebKit
  # (iOS Safari's engine) against the committed golden. A red run = a sim drift
  # that would flag honest players as deviators and forfeit real credits.
  determinism-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run determinism:browser
