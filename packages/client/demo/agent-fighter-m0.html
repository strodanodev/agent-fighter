<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Fighter — Milestone 0</title>
<style>
  html,body{margin:0;height:100%;background:#0b0c14;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:monospace;color:#666}
  canvas{image-rendering:pixelated;box-shadow:0 8px 40px #0009;max-width:98vw}
  p{margin:10px 0 0;font-size:12px}
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<p>AGENT FIGHTER · milestone 0 · deterministic sim skeleton</p>
<script>
// ---- core/src/fp.js ----
/**
 * Fixed-point math. All sim positions/velocities are integers in 1/256 px
 * ("subpixels", 24.8 fixed point). Determinism rule: the sim NEVER stores or
 * computes with floats. JS doubles represent integers exactly up to 2^53,
 * and all our products stay far below that, so integer math here is
 * bit-identical across engines/platforms.
 */
const FP = 256;
/** Convert whole pixels to fixed-point. */
const fp = (px) => Math.trunc(px * FP);
/** Fixed-point multiply: (a * b) / FP, truncated toward zero. */
const fpMul = (a, b) => Math.trunc((a * b) / FP);
/** Truncate toward zero to pixels (for rendering / hitbox rects only). */
const fpToPx = (v) => Math.trunc(v / FP);
/** Clamp integer value. */
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
/**
 * Deterministic PRNG (mulberry32-style, integer-only variant).
 * Lives inside GameState; never use Math.random in the sim.
 */
const nextRand = (seed) => {
    let t = (seed + 0x6d2b79f5) | 0;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t = (t + Math.imul(t ^ (t >>> 7), t | 61)) | 0;
    return (t ^ (t >>> 14)) >>> 0;
};

// ---- core/src/input.js ----
const held = (f, b) => (f & b) !== 0;
/** Rising edge: pressed this frame, not held last frame. */
const pressed = (now, prev, b) => (now & b) !== 0 && (prev & b) === 0;

// ---- core/src/data.js ----
const STAGE = {
    widthPx: 960,
    floorYPx: 460,
    wallPad: 24,
};
const TICKS_PER_SEC = 60;
const ROUND_SECONDS = 99;
/** M0 archetype: the rectangle fighter. */
const RECT_FIGHTER = {
    name: 'Rect Fighter',
    maxHealth: 1000,
    walkSpeed: fp(3),
    jumpVelY: fp(-13),
    gravity: fp(0.75),
    bodyWidth: 56,
    standHurtbox: { x: -28, y: -110, w: 56, h: 110 },
    attack: {
        id: '5P',
        steps: [
            { frames: 4, phase: 'startup', hurtbox: { x: -28, y: -110, w: 56, h: 110 } },
            {
                frames: 3,
                phase: 'active',
                hurtbox: { x: -28, y: -110, w: 60, h: 110 },
                hitbox: {
                    rect: { x: 20, y: -95, w: 55, h: 30 },
                    damage: 90,
                    hitstun: 14,
                    hitstopFrames: 6,
                    pushbackHit: fp(5),
                    knockdown: false,
                },
            },
            { frames: 9, phase: 'recovery', hurtbox: { x: -28, y: -110, w: 56, h: 110 } },
        ],
    },
};

// ---- core/src/state.js ----
/** M0: both players use the rectangle archetype. Later: per-player bundles. */
const characters = [RECT_FIGHTER, RECT_FIGHTER];
const spawnFighter = (x, facing, def) => ({
    x: fp(x),
    y: fp(STAGE.floorYPx),
    velX: 0,
    velY: 0,
    facing,
    health: def.maxHealth,
    action: 0 /* Action.Idle */,
    actionFrame: 0,
    hitstunLeft: 0,
    attackHasHit: 0,
    prevInput: 0,
});
const createGameState = (seed) => ({
    tick: 0,
    rngSeed: seed | 0,
    phase: 0 /* Phase.Fighting */,
    winner: -1,
    timerTicks: ROUND_SECONDS * TICKS_PER_SEC,
    hitstopLeft: 0,
    fighters: [
        spawnFighter(STAGE.widthPx / 2 - 160, 1, characters[0]),
        spawnFighter(STAGE.widthPx / 2 + 160, -1, characters[1]),
    ],
});
/** Cheap deep copy — the whole state is flat numbers. Required for rollback. */
const snapshot = (s) => ({
    ...s,
    fighters: [{ ...s.fighters[0] }, { ...s.fighters[1] }],
});
const restore = (dst, snap) => {
    Object.assign(dst, snap, {
        fighters: dst.fighters,
    });
    Object.assign(dst.fighters[0], snap.fighters[0]);
    Object.assign(dst.fighters[1], snap.fighters[1]);
};
const FIGHTER_FIELDS = [
    'x', 'y', 'velX', 'velY', 'facing', 'health',
    'action', 'actionFrame', 'hitstunLeft', 'attackHasHit', 'prevInput',
];
/** Deterministic flat serialization — field order is part of the protocol. */
const serialize = (s) => {
    const out = new Int32Array(6 + FIGHTER_FIELDS.length * 2);
    let i = 0;
    out[i++] = s.tick;
    out[i++] = s.rngSeed;
    out[i++] = s.phase;
    out[i++] = s.winner;
    out[i++] = s.timerTicks;
    out[i++] = s.hitstopLeft;
    for (const f of s.fighters) {
        for (const k of FIGHTER_FIELDS)
            out[i++] = f[k];
    }
    return out;
};
/** FNV-1a over the serialized state. Used for desync detection + CI replay tests. */
const stateHash = (s) => {
    const data = serialize(s);
    let h = 0x811c9dc5;
    for (let i = 0; i < data.length; i++) {
        const v = data[i];
        h ^= v & 0xff;
        h = Math.imul(h, 0x01000193);
        h ^= (v >>> 8) & 0xff;
        h = Math.imul(h, 0x01000193);
        h ^= (v >>> 16) & 0xff;
        h = Math.imul(h, 0x01000193);
        h ^= (v >>> 24) & 0xff;
        h = Math.imul(h, 0x01000193);
    }
    return h >>> 0;
};

// ---- core/src/sim.js ----
const FLOOR = fp(STAGE.floorYPx);
const WALL_L = fp(STAGE.wallPad);
const WALL_R = fp(STAGE.widthPx - STAGE.wallPad);
const FRICTION = fp(0.5);
/** Mirror a character-space rect into world space based on facing. */
const worldRect = (f, rc) => {
    const rx = fp(rc.x);
    const rw = fp(rc.w);
    const l = f.facing === 1 ? f.x + rx : f.x - rx - rw;
    return { l, t: f.y + fp(rc.y), r: l + rw, b: f.y + fp(rc.y) + fp(rc.h) };
};
const overlaps = (a, b) => a.l < b.r && b.l < a.r && a.t < b.b && b.t < a.b;
/** Resolve the current MoveStep for an attacking fighter, or null. */
const attackStep = (f, def) => {
    if (f.action !== 3 /* Action.Attack */)
        return null;
    let acc = 0;
    for (const step of def.attack.steps) {
        acc += step.frames;
        if (f.actionFrame < acc)
            return step;
    }
    return null;
};
const totalAttackFrames = (def) => def.attack.steps.reduce((n, s) => n + s.frames, 0);
const currentHurtbox = (f, def) => {
    const step = attackStep(f, def);
    return step ? step.hurtbox : def.standHurtbox;
};
const grounded = (f) => f.y >= FLOOR;
const setAction = (f, a) => {
    f.action = a;
    f.actionFrame = 0;
};
const updateFighter = (f, input, def) => {
    const prev = f.prevInput;
    switch (f.action) {
        case 5 /* Action.KO */:
            // Dead fighters still fall.
            break;
        case 4 /* Action.Hitstun */:
            f.hitstunLeft--;
            if (f.hitstunLeft <= 0 && grounded(f))
                setAction(f, 0 /* Action.Idle */);
            break;
        case 3 /* Action.Attack */: {
            f.actionFrame++;
            if (f.actionFrame >= totalAttackFrames(def))
                setAction(f, 0 /* Action.Idle */);
            break;
        }
        case 2 /* Action.Jump */:
            if (grounded(f) && f.velY >= 0) {
                f.velX = 0;
                setAction(f, 0 /* Action.Idle */);
            }
            break;
        case 0 /* Action.Idle */:
        case 1 /* Action.Walk */: {
            if (pressed(input, prev, 16 /* Btn.Attack */)) {
                f.velX = 0;
                f.attackHasHit = 0;
                setAction(f, 3 /* Action.Attack */);
                break;
            }
            if (held(input, 4 /* Btn.Up */)) {
                f.velY = def.jumpVelY;
                f.velX = held(input, 1 /* Btn.Left */) ? -def.walkSpeed : held(input, 2 /* Btn.Right */) ? def.walkSpeed : 0;
                setAction(f, 2 /* Action.Jump */);
                break;
            }
            const dir = (held(input, 2 /* Btn.Right */) ? 1 : 0) - (held(input, 1 /* Btn.Left */) ? 1 : 0);
            f.velX = dir * def.walkSpeed;
            const next = dir !== 0 ? 1 /* Action.Walk */ : 0 /* Action.Idle */;
            if (f.action !== next)
                setAction(f, next);
            else
                f.actionFrame++;
            break;
        }
    }
    // Physics: gravity + integrate + floor/walls.
    if (!grounded(f) || f.velY < 0)
        f.velY += def.gravity;
    f.x += f.velX;
    f.y += f.velY;
    if (f.y >= FLOOR) {
        f.y = FLOOR;
        f.velY = 0;
        if (f.action === 4 /* Action.Hitstun */ && f.hitstunLeft <= 0)
            setAction(f, 0 /* Action.Idle */);
    }
    f.x = clamp(f.x, WALL_L, WALL_R);
    // Hitstun ground friction.
    if (f.action === 4 /* Action.Hitstun */ && grounded(f)) {
        if (f.velX > 0)
            f.velX = Math.max(0, f.velX - FRICTION);
        else if (f.velX < 0)
            f.velX = Math.min(0, f.velX + FRICTION);
    }
    f.prevInput = input;
};
const applyHit = (victim, attacker, dmg, stun, push) => {
    victim.health = Math.max(0, victim.health - dmg);
    victim.hitstunLeft = stun;
    victim.velX = attacker.facing * push;
    victim.velY = 0;
    setAction(victim, victim.health <= 0 ? 5 /* Action.KO */ : 4 /* Action.Hitstun */);
};
/**
 * Advance the simulation exactly one tick. Mutates `s` in place.
 * This is the ONLY way state changes. Deterministic by construction.
 */
const step = (s, inputs) => {
    s.tick++;
    if (s.phase === 1 /* Phase.Over */)
        return;
    // Global hitstop: the crunch. Freeze everything except the countdown.
    if (s.hitstopLeft > 0) {
        s.hitstopLeft--;
        s.fighters[0].prevInput = inputs[0];
        s.fighters[1].prevInput = inputs[1];
        return;
    }
    const [f0, f1] = s.fighters;
    const [c0, c1] = characters;
    // Auto-face opponent (grounded, actionable states only).
    for (const [me, other] of [[f0, f1], [f1, f0]]) {
        if ((me.action === 0 /* Action.Idle */ || me.action === 1 /* Action.Walk */) && grounded(me)) {
            me.facing = other.x >= me.x ? 1 : -1;
        }
    }
    updateFighter(f0, inputs[0], c0);
    updateFighter(f1, inputs[1], c1);
    // Body push: fighters cannot fully overlap.
    const halfBodies = fp((c0.bodyWidth + c1.bodyWidth) / 2);
    const dx = f1.x - f0.x;
    const absDx = dx < 0 ? -dx : dx;
    if (absDx < halfBodies && Math.abs(fpToPx(f0.y - f1.y)) < 100) {
        const pushAmt = Math.trunc((halfBodies - absDx) / 2);
        const sign = dx === 0 ? f0.facing : dx > 0 ? 1 : -1;
        f0.x = clamp(f0.x - sign * pushAmt, WALL_L, WALL_R);
        f1.x = clamp(f1.x + sign * pushAmt, WALL_L, WALL_R);
    }
    // Hit detection — symmetric, allows trades. Boxes computed post-movement.
    const step0 = attackStep(f0, c0);
    const step1 = attackStep(f1, c1);
    const hit0 = // does f0's attack connect this tick?
     step0?.hitbox && !f0.attackHasHit && f1.action !== 5 /* Action.KO */ &&
        overlaps(worldRect(f0, step0.hitbox.rect), worldRect(f1, currentHurtbox(f1, c1)))
        ? step0.hitbox : null;
    const hit1 = step1?.hitbox && !f1.attackHasHit && f0.action !== 5 /* Action.KO */ &&
        overlaps(worldRect(f1, step1.hitbox.rect), worldRect(f0, currentHurtbox(f0, c0)))
        ? step1.hitbox : null;
    if (hit0) {
        f0.attackHasHit = 1;
        applyHit(f1, f0, hit0.damage, hit0.hitstun, hit0.pushbackHit);
        s.hitstopLeft = Math.max(s.hitstopLeft, hit0.hitstopFrames);
    }
    if (hit1) {
        f1.attackHasHit = 1;
        applyHit(f0, f1, hit1.damage, hit1.hitstun, hit1.pushbackHit);
        s.hitstopLeft = Math.max(s.hitstopLeft, hit1.hitstopFrames);
    }
    // Round end: KO or timeout.
    s.timerTicks--;
    const dead0 = f0.health <= 0;
    const dead1 = f1.health <= 0;
    if (dead0 || dead1) {
        s.phase = 1 /* Phase.Over */;
        s.winner = dead0 && dead1 ? 2 : dead0 ? 1 : 0;
    }
    else if (s.timerTicks <= 0) {
        s.phase = 1 /* Phase.Over */;
        s.winner = f0.health === f1.health ? 2 : f0.health > f1.health ? 0 : 1;
    }
};
/** Debug/render helper: world-space boxes in whole pixels. */
const debugBoxes = (s) => s.fighters.map((f, i) => {
    const def = characters[i];
    const stp = attackStep(f, def);
    const hb = stp?.hitbox && !f.attackHasHit ? worldRect(f, stp.hitbox.rect) : null;
    const hurt = worldRect(f, currentHurtbox(f, def));
    const toPx = (r) => ({
        x: fpToPx(r.l), y: fpToPx(r.t), w: fpToPx(r.r - r.l), h: fpToPx(r.b - r.t),
    });
    return { hurtbox: toPx(hurt), hitbox: hb ? toPx(hb) : null };
});

// ---- client/src/main.js ----
/**
 * Agent Fighter — Milestone 0 client.
 * Renderer is a pure function of GameState (plus cosmetic-only juice that
 * lives OUTSIDE the sim). Fixed-timestep 60Hz loop with an accumulator.
 * Canvas 2D for M0 (zero deps); the render() boundary is where PixiJS slots in.
 */

const TICK_MS = 1000 / TICKS_PER_SEC;
// ---------------------------------------------------------------- input
/** Keyboard InputSource for two local players sharing one keyboard. */
const keys = new Set();
addEventListener('keydown', (e) => {
    keys.add(e.code);
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code))
        e.preventDefault();
});
addEventListener('keyup', (e) => keys.delete(e.code));
const P0_MAP = [
    ['KeyA', 1 /* Btn.Left */], ['KeyD', 2 /* Btn.Right */], ['KeyW', 4 /* Btn.Up */], ['KeyS', 8 /* Btn.Down */], ['KeyF', 16 /* Btn.Attack */],
];
const P1_MAP = [
    ['ArrowLeft', 1 /* Btn.Left */], ['ArrowRight', 2 /* Btn.Right */], ['ArrowUp', 4 /* Btn.Up */], ['ArrowDown', 8 /* Btn.Down */], ['KeyK', 16 /* Btn.Attack */],
];
const pollKeyboard = (map) => {
    let f = 0;
    for (const [code, bit] of map)
        if (keys.has(code))
            f |= bit;
    return f;
};
// ---------------------------------------------------------------- game
let game = createGameState(1);
let showBoxes = true;
let inputLog = [];
let sparks = [];
let shake = 0;
let prevHealth = [game.fighters[0].health, game.fighters[1].health];
addEventListener('keydown', (e) => {
    if (e.code === 'KeyH')
        showBoxes = !showBoxes;
    if (e.code === 'Enter' && game.phase === 1 /* Phase.Over */) {
        game = createGameState((game.rngSeed + 1) | 0);
        inputLog = [];
        sparks = [];
        prevHealth = [game.fighters[0].health, game.fighters[1].health];
    }
});
// ---------------------------------------------------------------- canvas
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = STAGE.widthPx;
const H = 540;
const px = (fpv) => Math.trunc(fpv / 256);
const P_COLORS = [
    { body: '#e94560', accent: '#ff8fa3', name: 'P1' },
    { body: '#4ea8de', accent: '#a3d5ff', name: 'P2' },
];
const drawFighter = (i) => {
    const f = game.fighters[i];
    const c = P_COLORS[i];
    const x = px(f.x);
    const y = px(f.y);
    const w = 56;
    const h = 110;
    // Body: a rectangle with intent. Lean forward on attack, flash white in hitstun.
    const inHitstun = f.action === 4 /* Action.Hitstun */;
    const attacking = f.action === 3 /* Action.Attack */;
    ctx.save();
    ctx.translate(x, y);
    if (attacking)
        ctx.transform(1, 0, -0.08 * f.facing, 1, 0, 0);
    ctx.fillStyle = inHitstun && game.tick % 4 < 2 ? '#ffffff' : f.action === 5 /* Action.KO */ ? '#555' : c.body;
    ctx.fillRect(-w / 2, -h, w, h);
    // "Face" stripe shows facing.
    ctx.fillStyle = c.accent;
    ctx.fillRect(f.facing === 1 ? w / 2 - 10 : -w / 2, -h, 10, 26);
    // Fist block during active frames.
    if (attacking) {
        const boxes = debugBoxes(game)[i];
        if (boxes && boxes.hitbox) {
            ctx.fillStyle = c.accent;
            ctx.fillRect(boxes.hitbox.x - x, boxes.hitbox.y - y, boxes.hitbox.w, boxes.hitbox.h);
        }
    }
    ctx.restore();
};
const drawHud = () => {
    const barW = 380, barH = 22, pad = 30, top = 24;
    for (const i of [0, 1]) {
        const f = game.fighters[i];
        const ratio = Math.max(0, f.health) / 1000;
        const x = i === 0 ? pad : W - pad - barW;
        ctx.fillStyle = '#222738';
        ctx.fillRect(x, top, barW, barH);
        ctx.fillStyle = ratio > 0.3 ? '#ffd166' : '#e94560';
        const fillW = Math.round(barW * ratio);
        // Drain toward center: remaining health hugs the outer screen edge.
        ctx.fillRect(i === 0 ? x : x + barW - fillW, top, fillW, barH);
        ctx.strokeStyle = '#ffffff33';
        ctx.strokeRect(x + 0.5, top + 0.5, barW, barH);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 13px monospace';
        ctx.textAlign = i === 0 ? 'left' : 'right';
        ctx.fillText(P_COLORS[i].name, i === 0 ? x : x + barW, top + barH + 16);
    }
    // Timer.
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 30px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(String(Math.ceil(game.timerTicks / TICKS_PER_SEC)).padStart(2, '0'), W / 2, top + 24);
    ctx.font = '11px monospace';
    ctx.fillStyle = '#ffffff88';
    ctx.fillText('P1: WASD + F   ·   P2: Arrows + K   ·   H: hitboxes   ·   Enter: rematch', W / 2, H - 12);
    ctx.fillText(`tick ${game.tick}  hash ${stateHash(game).toString(16).padStart(8, '0')}`, W / 2, H - 28);
    if (game.phase === 1 /* Phase.Over */) {
        ctx.fillStyle = '#000000aa';
        ctx.fillRect(0, H / 2 - 70, W, 120);
        ctx.fillStyle = '#ffd166';
        ctx.font = 'bold 52px monospace';
        ctx.fillText(game.winner === 2 ? 'DRAW' : `${P_COLORS[game.winner].name} WINS`, W / 2, H / 2);
        ctx.font = '16px monospace';
        ctx.fillStyle = '#fff';
        ctx.fillText('Press Enter for rematch', W / 2, H / 2 + 32);
    }
};
const render = () => {
    ctx.save();
    if (shake > 0)
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake); // cosmetic only
    // Stage.
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#141625');
    grad.addColorStop(1, '#1f2233');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#2b2f45';
    ctx.fillRect(0, STAGE.floorYPx, W, H - STAGE.floorYPx);
    ctx.strokeStyle = '#3d4260';
    ctx.beginPath();
    ctx.moveTo(0, STAGE.floorYPx + 0.5);
    ctx.lineTo(W, STAGE.floorYPx + 0.5);
    ctx.stroke();
    drawFighter(0);
    drawFighter(1);
    // Hit sparks (cosmetic).
    for (const sp of sparks) {
        const r = 4 + sp.age * 3;
        ctx.strokeStyle = `rgba(255, 209, 102, ${1 - sp.age / 8})`;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, r, 0, Math.PI * 2);
        ctx.stroke();
    }
    ctx.lineWidth = 1;
    // Debug boxes.
    if (showBoxes) {
        for (const b of debugBoxes(game)) {
            ctx.strokeStyle = '#4ade80';
            ctx.strokeRect(b.hurtbox.x + 0.5, b.hurtbox.y + 0.5, b.hurtbox.w, b.hurtbox.h);
            if (b.hitbox) {
                ctx.strokeStyle = '#f87171';
                ctx.strokeRect(b.hitbox.x + 0.5, b.hitbox.y + 0.5, b.hitbox.w, b.hitbox.h);
            }
        }
    }
    drawHud();
    ctx.restore();
};
// ---------------------------------------------------------------- loop
let last = performance.now();
let acc = 0;
const frame = (now) => {
    acc += now - last;
    last = now;
    if (acc > 200)
        acc = 200; // tab-switch guard
    while (acc >= TICK_MS) {
        const inputs = [pollKeyboard(P0_MAP), pollKeyboard(P1_MAP)];
        if (game.phase === 0 /* Phase.Fighting */)
            inputLog.push(inputs);
        step(game, inputs);
        acc -= TICK_MS;
        // Juice triggers: detect damage outside the sim.
        for (const i of [0, 1]) {
            if (game.fighters[i].health < prevHealth[i]) {
                const f = game.fighters[i];
                sparks.push({ x: px(f.x) + f.facing * -20, y: px(f.y) - 85, age: 0 });
                shake = 7;
            }
            prevHealth[i] = game.fighters[i].health;
        }
    }
    sparks = sparks.filter((sp) => ++sp.age < 8);
    shake = Math.max(0, shake - 0.6);
    render();
    requestAnimationFrame(frame);
};
requestAnimationFrame(frame);
// Expose for console poking / future replay export (input log = full match record).
Object.assign(globalThis, { afGame: () => game, afInputLog: () => inputLog });
</script>
</body>
</html>
