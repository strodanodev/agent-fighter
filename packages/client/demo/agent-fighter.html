// ---- core/src/fp.js ----
/**
 * Fixed-point math. All sim positions/velocities are integers in 1/256 px
 * ("subpixels", 24.8 fixed point). Determinism rule: the sim NEVER stores or
 * computes with floats. JS doubles represent integers exactly up to 2^53,
 * and all our products stay far below that, so integer math here is
 * bit-identical across engines/platforms.
 */
const FP = 256;
/** Convert whole pixels to fixed-point. */
const fp = (px) => Math.trunc(px * FP);
/** Fixed-point multiply: (a * b) / FP, truncated toward zero. */
const fpMul = (a, b) => Math.trunc((a * b) / FP);
/** Truncate toward zero to pixels (for rendering / hitbox rects only). */
const fpToPx = (v) => Math.trunc(v / FP);
/** Clamp integer value. */
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
/**
 * Deterministic PRNG (mulberry32-style, integer-only variant).
 * Lives inside GameState; never use Math.random in the sim.
 */
const nextRand = (seed) => {
    let t = (seed + 0x6d2b79f5) | 0;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t = (t + Math.imul(t ^ (t >>> 7), t | 61)) | 0;
    return (t ^ (t >>> 14)) >>> 0;
};

// ---- core/src/input.js ----
const PUNCH_MASK = 16 /* Btn.LP */ | 32 /* Btn.MP */ | 64 /* Btn.HP */;
const KICK_MASK = 128 /* Btn.LK */ | 256 /* Btn.MK */ | 512 /* Btn.HK */;
const ATTACK_MASK = PUNCH_MASK | KICK_MASK;
const DIR_MASK = 1 /* Btn.Left */ | 2 /* Btn.Right */ | 4 /* Btn.Up */ | 8 /* Btn.Down */;
const held = (f, b) => (f & b) !== 0;
/** Rising edge: pressed this frame, not held last frame. */
const pressed = (now, prev, b) => (now & b) !== 0 && (prev & b) === 0;
/** All attack buttons newly pressed this frame, as a mask. */
const pressedAttacks = (now, prev) => now & ~prev & ATTACK_MASK;
/** Popcount for small masks (attack buttons). Deterministic integer loop. */
const countBits = (v) => {
    let n = 0;
    while (v !== 0) {
        n += v & 1;
        v >>>= 1;
    }
    return n;
};

// ---- core/src/data.js ----
// ---------------------------------------------------------------------------
// Loaded character: bundle + precomputed lookup tables the sim uses per tick.
// Built once at load; all lookups by integer index (deterministic).
// ---------------------------------------------------------------------------
const BUTTON_BITS = {
    LP: 16 /* Btn.LP */, MP: 32 /* Btn.MP */, HP: 64 /* Btn.HP */, LK: 128 /* Btn.LK */, MK: 256 /* Btn.MK */, HK: 512 /* Btn.HK */,
};
/** Resolution priority when several buttons are pressed the same frame. */
const BUTTON_PRIORITY = ['HP', 'HK', 'MP', 'MK', 'LP', 'LK'];
const STANCE_IDX = { stand: 0, crouch: 1, air: 2 };
const bitPos = (bit) => {
    let p = 0;
    while ((bit >>= 1) !== 0)
        p++;
    return p;
};
/** Validate + index a character bundle. Throws on malformed data. */
const loadCharacter = (b) => {
    const n = b.moves.length;
    const moveIdxById = {};
    b.moves.forEach((m, i) => {
        if (moveIdxById[m.id] !== undefined)
            throw new Error(`duplicate move id: ${m.id}`);
        if (m.steps.length === 0)
            throw new Error(`move ${m.id} has no steps`);
        for (const st of m.steps) {
            if (!Number.isInteger(st.frames) || st.frames <= 0) {
                throw new Error(`move ${m.id}: step frames must be positive integers`);
            }
        }
        moveIdxById[m.id] = i;
    });
    const normals = [new Int32Array(10).fill(-1), new Int32Array(10).fill(-1), new Int32Array(10).fill(-1)];
    const specials = [];
    let superIdx = -1;
    const totalFrames = new Int32Array(n);
    const firstActiveStep = new Int32Array(n).fill(-1);
    b.moves.forEach((m, i) => {
        totalFrames[i] = m.steps.reduce((acc, s) => acc + s.frames, 0);
        const act = m.steps.findIndex((s) => s.phase === 'active');
        firstActiveStep[i] = act;
        if (m.type === 'normal') {
            if (!m.button)
                throw new Error(`normal ${m.id} missing button`);
            normals[STANCE_IDX[m.stance]][bitPos(BUTTON_BITS[m.button])] = i;
        }
        else if (m.type === 'special') {
            if (!m.motion || !m.buttons || m.buttons === 'PP')
                throw new Error(`special ${m.id} needs motion + P/K`);
            specials.push({ motion: m.motion, kind: m.buttons, idx: i });
        }
        else if (m.type === 'super') {
            if (!m.motion || m.buttons !== 'PP')
                throw new Error(`super ${m.id} needs motion + PP`);
            if (m.meterCost === undefined)
                throw new Error(`super ${m.id} missing meterCost`);
            superIdx = i;
        }
    });
    const cancelHit = new Uint8Array(n * n);
    const cancelBlock = new Uint8Array(n * n);
    for (const edge of b.cancels) {
        const from = moveIdxById[edge.from];
        if (from === undefined)
            throw new Error(`cancel edge from unknown move: ${edge.from}`);
        for (const toId of edge.to) {
            const to = moveIdxById[toId];
            if (to === undefined)
                throw new Error(`cancel edge to unknown move: ${toId}`);
            if (edge.on.includes('hit'))
                cancelHit[from * n + to] = 1;
            if (edge.on.includes('block'))
                cancelBlock[from * n + to] = 1;
        }
    }
    return { b, moveIdxById, normals, specials, superIdx, totalFrames, firstActiveStep, cancelHit, cancelBlock };
};

/**
 * Animation resolution: map ANY fighter state to a sprite frame name from the
 * character bundle. Attack states use their own move's steps; every other
 * action maps to a system move (`type: "system"`, ids below — spec §4:
 * "round intro/KO/win poses are just Moves in the data format").
 *
 * Purely cosmetic: the sim never calls this; hurtboxes stay driven by the
 * engine's stand/crouch/air boxes. Deterministic pure function so client,
 * studio, and future replay viewers all resolve identical frames.
 */
/** Canonical system animation ids. Characters may omit any (renderer falls back). */
const SYS = {
    idle: 'sys.idle',
    walkF: 'sys.walkF',
    walkB: 'sys.walkB',
    crouch: 'sys.crouch',
    jump: 'sys.jump', // 3 steps: rising / apex / falling (picked by velY)
    dashF: 'sys.dashF',
    dashB: 'sys.dashB',
    block: 'sys.block',
    blockCrouch: 'sys.blockCrouch',
    blockAir: 'sys.blockAir',
    hitstun: 'sys.hitstun',
    airHitstun: 'sys.airHitstun',
    knockdown: 'sys.knockdown',
    getup: 'sys.getup',
    ko: 'sys.ko',
};
const stepSpriteAt = (ch, moveIdx, frame) => {
    const move = ch.b.moves[moveIdx];
    if (!move)
        return null;
    let acc = 0;
    for (const s of move.steps) {
        acc += s.frames;
        if (frame < acc)
            return s.sprite ?? null;
    }
    return move.steps[move.steps.length - 1]?.sprite ?? null;
};
/** Looping animation: counter wraps over the move's total frames. */
const loopSprite = (ch, id, counter) => {
    const idx = ch.moveIdxById[id];
    if (idx === undefined)
        return null;
    const total = ch.totalFrames[idx];
    return stepSpriteAt(ch, idx, total > 0 ? counter % total : 0);
};
/** One-shot animation: clamps to the last step. */
const onceSprite = (ch, id, counter) => {
    const idx = ch.moveIdxById[id];
    if (idx === undefined)
        return null;
    return stepSpriteAt(ch, idx, Math.min(counter, ch.totalFrames[idx] - 1));
};
/** Fixed step of a multi-step system move (e.g. jump rise/apex/fall). */
const stepOf = (ch, id, step) => {
    const idx = ch.moveIdxById[id];
    if (idx === undefined)
        return null;
    const move = ch.b.moves[idx];
    const s = move.steps[Math.min(step, move.steps.length - 1)];
    return s?.sprite ?? null;
};
const VEL_EPS = fp(2);
/**
 * Resolve the sprite for a fighter's current state, or null (render fallback).
 * `tick` drives loops for states whose actionFrame does not advance.
 */
const spriteForFighter = (f, ch, tick) => {
    const airFrame = () => f.velY < -VEL_EPS ? stepOf(ch, SYS.jump, 0)
        : f.velY <= VEL_EPS ? stepOf(ch, SYS.jump, 1)
            : stepOf(ch, SYS.jump, 2);
    switch (f.action) {
        case 9 /* Action.Attack */:
            return f.moveIdx >= 0 ? stepSpriteAt(ch, f.moveIdx, f.actionFrame) : null;
        case 0 /* Action.Idle */:
            return loopSprite(ch, SYS.idle, f.actionFrame);
        case 1 /* Action.WalkF */:
            return loopSprite(ch, SYS.walkF, f.actionFrame);
        case 2 /* Action.WalkB */:
            return loopSprite(ch, SYS.walkB, f.actionFrame);
        case 3 /* Action.Crouch */:
            return loopSprite(ch, SYS.crouch, f.actionFrame);
        case 4 /* Action.JumpSquat */:
            return stepOf(ch, SYS.crouch, 0);
        case 5 /* Action.Air */:
            return airFrame();
        case 8 /* Action.AirDash */:
            return stepOf(ch, SYS.dashF, 0) ?? airFrame();
        case 6 /* Action.DashF */:
            return stepOf(ch, SYS.dashF, 0);
        case 7 /* Action.DashB */:
            return stepOf(ch, SYS.dashB, 0);
        case 12 /* Action.BlockStand */:
            return stepOf(ch, SYS.block, 0);
        case 13 /* Action.BlockCrouch */:
            return stepOf(ch, SYS.blockCrouch, 0);
        case 14 /* Action.BlockAir */:
            return stepOf(ch, SYS.blockAir, 0);
        case 10 /* Action.Hitstun */:
        case 18 /* Action.Thrown */:
            return stepOf(ch, SYS.hitstun, 0);
        case 11 /* Action.AirHitstun */:
            return stepOf(ch, SYS.airHitstun, 0);
        case 15 /* Action.Knockdown */:
            return stepOf(ch, SYS.knockdown, 0);
        case 16 /* Action.Getup */:
            return onceSprite(ch, SYS.getup, f.actionFrame);
        case 17 /* Action.Grab */:
            return stepOf(ch, SYS.idle, 0);
        case 19 /* Action.KO */:
            return f.velY !== 0 ? stepOf(ch, SYS.airHitstun, 0)
                : stepOf(ch, SYS.ko, 0) ?? stepOf(ch, SYS.knockdown, 0);
        default:
            return loopSprite(ch, SYS.idle, tick);
    }
};

// ---- core/src/ai.js ----
// ---------------------------------------------------------------- helpers
const rnd = (ai, n) => {
    ai.rng = nextRand(ai.rng);
    return ai.rng % n;
};
/** True with probability p/255. */
const chance = (ai, p) => rnd(ai, 255) < p;
/** Linear interpolation on the skill lever: value at skill 0 → value at 100. */
const lerp = (ai, at0, at100) => at0 + Math.trunc(((at100 - at0) * ai.skill) / 100);
const pxDist = (a, b) => Math.abs(fpToPx(a.x - b.x));
const aiGrounded = (f) => f.y >= fp(460);
const actionable = (f) => f.action === 0 /* Action.Idle */ || f.action === 1 /* Action.WalkF */
    || f.action === 2 /* Action.WalkB */ || f.action === 3 /* Action.Crouch */;
// ---------------------------------------------------------------- create
const createAi = (side, skill, seed) => {
    const ai = {
        side,
        skill: Math.max(0, Math.min(100, skill)),
        rng: (seed | 0) ^ 0x51ed1e5,
        p: { aggression: 0, jumpiness: 0, zoner: 0, throwHappy: 0, pushblocker: 0, patience: 0 },
        intent: 0 /* Intent.Observe */,
        intentUntil: 0,
        queue: [],
        qTicks: 0,
        oppAction: -1,
        oppActionAt: 0,
        reacted: 1,
        moveDir: 0,
        moveTicks: 0,
        guardHigh: 0,
        eatJump: 0, eatLow: 0, eatOverhead: 0, eatThrow: 0, eatProj: 0,
        lastHealth: -1,
        airAttackDone: 0,
        bookGround: [], bookLauncher: -1, bookAir: [],
        idxFireball: -1, idxDp: -1, idxSweep: -1, idxLow: -1, idxSuper: -1,
        bookBuilt: 0,
    };
    // Personality: sampled once — this "person" for this match.
    ai.p.aggression = 90 + rnd(ai, 130);
    ai.p.jumpiness = 40 + rnd(ai, 150);
    ai.p.zoner = 40 + rnd(ai, 170);
    ai.p.throwHappy = 30 + rnd(ai, 120);
    ai.p.pushblocker = 60 + rnd(ai, 160);
    ai.p.patience = 60 + rnd(ai, 140);
    return ai;
};
/** Combo routes come from the character's own data — cancel graph included. */
const buildBook = (ai, ch) => {
    const id = (s) => ch.moveIdxById[s] ?? -1;
    ai.bookGround = ['5LP', '5MP', '5HP'].map(id).filter((i) => i >= 0);
    ai.bookLauncher = id('2HP');
    ai.bookAir = ['j.LP', 'j.MP', 'j.HP'].map(id).filter((i) => i >= 0);
    ai.idxFireball = id('236P');
    ai.idxDp = id('623P');
    ai.idxSweep = id('2HK');
    ai.idxLow = id('2LK');
    ai.idxSuper = ch.superIdx;
    ai.bookBuilt = 1;
};
const BUTTON_OF = {
    LP: 16 /* Btn.LP */, MP: 32 /* Btn.MP */, HP: 64 /* Btn.HP */, LK: 128 /* Btn.LK */, MK: 256 /* Btn.MK */, HK: 512 /* Btn.HK */,
};
const buttonOfMove = (ch, idx) => {
    const b = ch.b.moves[idx]?.button;
    return b ? BUTTON_OF[b] : 16 /* Btn.LP */;
};
// ---------------------------------------------------------------- queueing
const q = (ai, step) => { ai.queue.push(step); };
const qTapButton = (ai, buttons, down = 0) => {
    q(ai, { buttons, down, ticks: 2 });
    q(ai, { down, ticks: 1 });
};
/** Queue a QCF motion + punch — sloppy at low skill (sometimes fails, human). */
const qFireball = (ai, buttons) => {
    const sloppy = !chance(ai, lerp(ai, 140, 250)); // execution success odds
    q(ai, { down: 1, ticks: 3 });
    q(ai, { down: 1, fwd: 1, ticks: 2 });
    if (sloppy) {
        // Rushed the motion: skip the forward — parser may drop it. Human whiff.
        q(ai, { buttons, ticks: 2 });
    }
    else {
        q(ai, { fwd: 1, ticks: 2 });
        q(ai, { fwd: 1, buttons, ticks: 2 });
    }
    q(ai, { ticks: 2 });
};
/** DP: f, d, df + P. */
const qDp = (ai, buttons) => {
    q(ai, { fwd: 1, ticks: 2 });
    q(ai, { down: 1, ticks: 2 });
    q(ai, { down: 1, fwd: 1, buttons, ticks: 3 });
    q(ai, { ticks: 2 });
};
const qDash = (ai, dir) => {
    const d = dir === 'fwd' ? { fwd: 1 } : { back: 1 };

    q(ai, { ticks: 2 });
    q(ai, { ...d, ticks: 3 });

// ---------------------------------------------------------------- emission
/** Translate a facing-relative step into an InputFrame for this tick. */
const emit = (me, step, moveDir, crouch) => {
    let f = 0;
    const fwdBit = me.facing === 1 ? 2 /* Btn.Right */ : 1 /* Btn.Left */;
    const backBit = me.facing === 1 ? 1 /* Btn.Left */ : 2 /* Btn.Right */;
    if (step) {
        if (step.fwd)
            f |= fwdBit;
        if (step.back)
            f |= backBit;
        if (step.up)
            f |= 4 /* Btn.Up */;
        if (step.down)
            f |= 8 /* Btn.Down */;
        if (step.buttons)
            f |= step.buttons;
        return f;
    }
    if (moveDir === 1)
        f |= fwdBit;
    else if (moveDir === -1)
        f |= backBit;

        f |= 8 /* Btn.Down */;

// ---------------------------------------------------------------- the brain
const aiPoll = (ai, g) => {

        buildBook(ai, ch);
    if (ai.lastHealth < 0)
        ai.lastHealth = me.health;
    if (g.phase !== 1 /* Phase.Fighting */) {
        ai.queue = [];
        ai.qTicks = 0;
        ai.intent = 0 /* Intent.Observe */;
        ai.lastHealth = me.health;
        return 0;
    }
    const dist = pxDist(me, op);
    const reaction = lerp(ai, 22, 7) + rnd(ai, lerp(ai, 8, 3)); // frames + jitter
    const seen = (sinceTick) => g.tick - sinceTick >= reaction;
    // ---- perception bookkeeping
    if (op.action !== ai.oppAction) {
        ai.oppAction = op.action;
        ai.oppActionAt = g.tick;
        ai.reacted = 0;
    }
    // ---- adaptation: classify how I just got hit
    if (me.health < ai.lastHealth) {
        if (!aiGrounded(op))
            ai.eatJump = Math.min(9, ai.eatJump + 1);
        else if (op.action === 17 /* Action.Grab */ || me.action === 18 /* Action.Thrown */)
            ai.eatThrow = Math.min(9, ai.eatThrow + 1);
        else if (op.action === 3 /* Action.Crouch */ || op.action === 9 /* Action.Attack */) {
            // crude read: low pokes come from crouch-stance moves
            const opCh = characters[(1 - ai.side)];
            const mv = op.moveIdx >= 0 ? opCh.b.moves[op.moveIdx] : null;
            if (mv?.stance === 'crouch')
                ai.eatLow = Math.min(9, ai.eatLow + 1);
        }

    }
    else if (me.health > ai.lastHealth) {
        ai.lastHealth = me.health;
    }

    if (ai.queue.length > 0) {
        const step = ai.queue[0];
        const frame = emit(me, step, 0, false);
        if (++ai.qTicks >= step.ticks) {
            ai.queue.shift();
            ai.qTicks = 0;
        }
        return frame;

    switch (me.action) {
        case 18 /* Action.Thrown */: {
            // Throw tech after human delay; success scales with skill.
            if (g.tick - ai.oppActionAt >= Math.max(3, reaction - 4)
                && chance(ai, lerp(ai, 40, 215))) {
                qTapButton(ai, 64 /* Btn.HP */);
            }
            return emit(me, null, 0, false);
        }
        case 12 /* Action.BlockStand */:
        case 13 /* Action.BlockCrouch */: {
            // Pushblock habit (advancing guard) — more at higher skill.
            if (chance(ai, Math.trunc((ai.p.pushblocker * lerp(ai, 20, 110)) / 255))) {
                qTapButton(ai, 16 /* Btn.LP */ | 32 /* Btn.MP */, me.action === 13 /* Action.BlockCrouch */ ? 1 : 0);

            ai.intent = 7 /* Intent.Defend */; // when I come out, expect pressure
            ai.intentUntil = g.tick + 30;

            if (!ai.airAttackDone && ai.bookAir.length > 0) {

                if (closing) {
                    ai.airAttackDone = 1;
                    const pick = ai.bookAir[rnd(ai, ai.bookAir.length)];

            if (me.attackConnected === 1) {

                    return emit(me, null, 0, false); // queued; emitted next tick
            }
            else if (me.attackConnected === 2 && chance(ai, lerp(ai, 90, 30))) {
                // Low skill mashes one more into block sometimes — very human.
                const gi = ai.bookGround.indexOf(me.moveIdx);
                if (gi >= 0 && gi + 1 < ai.bookGround.length) {
                    qTapButton(ai, buttonOfMove(ch, ai.bookGround[gi + 1]));

        if (oppAirborne && !aiGrounded(op) && dist < 240) {
            const aaOdds = Math.min(240, lerp(ai, 30, 190) + ai.eatJump * 12);
            if (chance(ai, aaOdds)) {
                ai.reacted = 1;
                if (ai.idxDp >= 0 && chance(ai, 170))
                    qDp(ai, 64 /* Btn.HP */);
                else if (ai.bookLauncher >= 0)
                    qTapButton(ai, 64 /* Btn.HP */, 1); // 2HP
                return emit(me, null, 0, false);
            }

        // Opponent started an attack in my face → guard.
        if (ai.oppAction === 9 /* Action.Attack */ && dist < 200) {
            ai.reacted = 1;
            if (chance(ai, lerp(ai, 120, 235))) {
                ai.intent = 7 /* Intent.Defend */;
                ai.intentUntil = g.tick + 26 + rnd(ai, 30);

        // Opponent is getting up next to me → okizeme.

            ai.reacted = 1;

        const pdist = Math.abs(fpToPx(pr.x - me.x));
        if (towardMe && pdist < lerp(ai, 120, 260) && pdist > 40) {
            if (chance(ai, Math.min(220, ai.p.jumpiness + ai.eatProj * 20))) {

                ai.eatProj = Math.max(0, ai.eatProj - 1);

            else {
                ai.intent = 7 /* Intent.Defend */;
                ai.intentUntil = g.tick + 24;

        ai.intent = 6 /* Intent.Punish */;
        ai.intentUntil = g.tick + 40;

// ---------------------------------------------------------------- intents
const pickIntent = (ai, g, me, op, dist) => {
    // Utility-ish weighted pick, shaped by distance band + personality + memory.
    const w = [];

    if (dist < 110) {
        w.push([3 /* Intent.Pressure */, ai.p.aggression + (losing ? 40 : 0)]);
        w.push([0 /* Intent.Observe */, 60]);
        w.push([2 /* Intent.Retreat */, 70 - Math.trunc(ai.p.aggression / 4)]);
        w.push([7 /* Intent.Defend */, 50 + ai.eatThrow * 10]);
    }
    else if (dist < 260) {
        w.push([1 /* Intent.Approach */, ai.p.aggression]);
        w.push([0 /* Intent.Observe */, ai.p.patience]);
        w.push([5 /* Intent.JumpIn */, Math.trunc(ai.p.jumpiness / 2)]);
        w.push([2 /* Intent.Retreat */, 45]);

            w.push([4 /* Intent.Zone */, Math.trunc(ai.p.zoner / 3)]);

            w.push([4 /* Intent.Zone */, ai.p.zoner + (losing ? -30 : 20)]);

        w.push([0 /* Intent.Observe */, Math.trunc(ai.p.patience / 2)]);

            return emit(me, null, 0, false);
        }

            q(ai, { up: 1, fwd: 1, ticks: 4 });

/** Pick a string opener at close range: jab chain / low / sweep / throw. */
const openString = (ai, ch, dist) => {
    const roll = rnd(ai, 255);
    if (dist < 70 && roll < ai.p.throwHappy) {
        q(ai, { fwd: 1, buttons: 64 /* Btn.HP */, ticks: 2 }); // throw attempt
        return;
    }
    if (roll < 100 && ai.idxLow >= 0) {
        qTapButton(ai, 128 /* Btn.LK */, 1); // 2LK — low opener
        return;
    }
    if (roll < 140 && ai.idxSweep >= 0 && chance(ai, 90)) {
        qTapButton(ai, 512 /* Btn.HK */, 1); // sweep

/**

 * Every link can be flubbed (dropped/late) — that's the human hand.
 */
const comboNext = (ai, ch, me) => {
    // Flubbed link: hesitate — the buffer may still save it, sometimes not.
    const flub = !chance(ai, lerp(ai, 150, 246));
    const delay = flub ? 3 + rnd(ai, 5) : 0;
    const gi = ai.bookGround.indexOf(me.moveIdx);
    if (gi >= 0) {
        if (gi + 1 < ai.bookGround.length) {
            if (delay)
                q(ai, { ticks: delay });
            qTapButton(ai, buttonOfMove(ch, ai.bookGround[gi + 1]));
            return true;

/**
 * Player progression: XP → level, persisted in localStorage (server profiles
 * arrive with M5/Privy — this is deliberately client-local until then).
 *
 * The CPU's strength follows the player's level, adjusted by a LEVER the
 * player controls (±). One mapping, one knob:
 *
 *   cpuLevel = clamp(playerLevel + lever, 1, MAX_LEVEL)
 *   aiSkill  = cpuLevel · 100 / MAX_LEVEL          (the core AI's 0-100 lever)
 */
const MAX_LEVEL = 40;
const KEY = 'af-profile';
const LEVER_KEY = 'af-cpu-lever';
const loadProfile = () => {
    try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
            const p = JSON.parse(raw);
            if (typeof p.xp === 'number' && typeof p.level === 'number') {
                return { xp: p.xp, level: Math.max(1, p.level), wins: p.wins | 0, losses: p.losses | 0 };
            }
        }

    catch { /* fresh profile */ }
    return { xp: 0, level: 1, wins: 0, losses: 0 };

const saveProfile = (p) => {
    try {
        localStorage.setItem(KEY, JSON.stringify(p));
    }
    catch { /* private mode */ }
};

const xpForNext = (level) => 80 + level * 45;

const awardXp = (p, s) => {
    const gained = (s.won ? 60 : 20)
        + Math.min(60, Math.trunc(s.damageDealt / 250))
        + Math.min(40, s.bestCombo * 4);

    if (s.won)
        p.wins++;
    else
        p.losses++;

    while (p.level < MAX_LEVEL && p.xp >= xpForNext(p.level)) {
        p.xp -= xpForNext(p.level);
        p.level++;
        levelsUp++;
    }

    return { gained, levelsUp };
};
// ---- the lever -------------------------------------------------------------
const loadLever = () => {
    const v = Number(localStorage.getItem(LEVER_KEY) ?? '0');
    return Number.isFinite(v) ? Math.max(-10, Math.min(10, v)) : 0;

const saveLever = (v) => {
    try {
        localStorage.setItem(LEVER_KEY, String(v));

};

 * float math freely and is safe under future rollback (it is never simulated,
 * only re-derived from whatever GameState the frame is showing).

 * passed in as plain numbers/colors — so it can sit before ui.ts/main.ts in
 * the bundle with no import cycle. Two families live here:
 *
 *   1. A pooled PARTICLE SYSTEM (emit* → updateFx → drawFx). Particles are
 *      drawn additively as cached soft-dot sprites, so hundreds of them bloom
 *      and stack cheaply without a per-particle gradient allocation.
 *   2. Stateless IMMEDIATE-MODE helpers (auraGlow / glowBar / warningPulse /
 *      marchingOutline / fxPulse) the HUD and world renderer call directly to
 *      wrap bars, frames and characters in glow.

 * stacked canvas or a full rewrite for effects 2D already does well. See the
 * commit that introduced this file.

    grd.addColorStop(0.4, `rgba(${r},${g},${b},0.55)`);
    grd.addColorStop(1, `rgba(${r},${g},${b},0)`);

            drag: 0.9, grav: 0.35, color: [r, g, b], layer,

        const ang = fxRnd(0, Math.PI * 2);
        spawn({
            x, y, vx: Math.cos(ang) * fxRnd(2, 6), vy: Math.sin(ang) * fxRnd(2, 6),

    const floorY = STAGE.floorYPx;

        ctx.fillStyle = 'rgba(16, 10, 28, 0.18)'; // veil: fighters pop
        ctx.fillRect(L - 10, T - 10, viewW + 20, viewH + 20);
        return;

    ctx.fill();

        if (x > R + 60 || x + bw < L - 60)

    }

    for (let i = 0; i < 26; i++) {

        ctx.lineTo(wx, floorY);
        ctx.stroke();
    }
    ctx.strokeStyle = '#4a4260';
    ctx.lineWidth = 3;
    ctx.beginPath();

    ctx.lineTo(R + 10, fenceTop);
    ctx.stroke();

    ctx.fillRect(L - 10, floorY, viewW + 20, Math.max(40, B - floorY + 20));
    ctx.fillStyle = '#3e384a';
    ctx.fillRect(L - 10, floorY, viewW + 20, 5);
    ctx.strokeStyle = '#5a5370';
    ctx.lineWidth = 1;

/**
 * Progressive-web-app glue: registers the service worker and shows a one-time
 * "install" prompt on the landing screen.
 *
 *  - Chromium (Android/desktop): captures `beforeinstallprompt` and offers a
 *    native install via a custom banner button.
 *  - iOS/iPadOS Safari: no install event exists, so we show the manual
 *    "Share → Add to Home Screen" hint instead.
 *
 * The banner appears only on the first visit (per-browser `localStorage` flag)
 * and never when the app is already running installed (standalone display mode).
 */
const SEEN_KEY = 'af_pwa_prompt_seen';
const isStandalone = () => (typeof matchMedia === 'function' && matchMedia('(display-mode: standalone)').matches)
    || matchMedia('(display-mode: fullscreen)').matches
    || navigator.standalone === true;
const isIos = () => {
    const ua = navigator.userAgent || '';
    return /iPhone|iPad|iPod/i.test(ua)
        || (/Macintosh/.test(ua) && 'ontouchend' in document);
};
const showBanner = (mode, onInstall) => {
    if (document.getElementById('af-pwa'))
        return;
    const style = document.createElement('style');
    style.textContent = `
    #af-pwa{position:fixed;left:50%;bottom:max(3vmin,env(safe-area-inset-bottom));
      transform:translateX(-50%);z-index:120;max-width:min(92vw,440px);
      display:flex;gap:14px;align-items:center;padding:14px 16px;border-radius:16px;
      background:#0a0616f2;border:2px solid #d9a44177;color:#f7e0a3;
      box-shadow:0 10px 40px #000c;font-family:"Courier New",monospace;
      animation:afpwaIn .35s ease-out}
    @keyframes afpwaIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
    #af-pwa img{width:52px;height:52px;border-radius:12px;flex:0 0 auto}
    #af-pwa .txt{flex:1 1 auto;font-size:13px;line-height:1.35}
    #af-pwa .txt b{color:#ffd166;font-size:14px}
    #af-pwa .row{display:flex;gap:8px;margin-top:8px}
    #af-pwa button{border:0;border-radius:9px;font-family:inherit;font-weight:700;
      font-size:13px;padding:8px 14px;cursor:pointer}
    #af-pwa .go{background:linear-gradient(#ffd166,#d9a441);color:#0a0616}
    #af-pwa .no{background:#ffffff14;color:#ffffffb0}
    #af-pwa .x{position:absolute;top:6px;right:10px;background:none;color:#ffffff66;font-size:18px;padding:2px 6px}
  `;
    document.head.appendChild(style);
    const el = document.createElement('div');
    el.id = 'af-pwa';
    const dismiss = () => { try {
        localStorage.setItem(SEEN_KEY, '1');
    }
    catch { /* private mode */ } el.remove(); };
    if (mode === 'install') {
        el.innerHTML = `
      <img src="/assets/icons/icon-192.png" alt="">
      <div class="txt"><b>Install Agent Fighter</b><br>Add it to your home screen for full-screen, offline play.
        <div class="row"><button class="go">Install</button><button class="no">Not now</button></div></div>
      <button class="x" aria-label="close">×</button>`;
        el.querySelector('.go').addEventListener('click', () => { el.remove(); onInstall?.(); });
    }
    else {
        el.innerHTML = `
      <img src="/assets/icons/icon-192.png" alt="">
      <div class="txt"><b>Install Agent Fighter</b><br>Tap the Share button, then <b>Add to Home Screen</b> for full-screen play.
        <div class="row"><button class="no">Got it</button></div></div>
      <button class="x" aria-label="close">×</button>`;
    }
    el.querySelector('.no')?.addEventListener('click', dismiss);
    el.querySelector('.x').addEventListener('click', dismiss);
    document.body.appendChild(el);
};
/** Register the SW and, on a first mobile visit, offer to install. */
const initPwa = () => {
    if ('serviceWorker' in navigator) {
        // Register after load so it never competes with first-paint asset fetches.
        addEventListener('load', () => { void navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(() => { }); });
    }
    if (isStandalone())
        return; // already installed — nothing to offer
    // Read the flag live rather than caching it: dismissing writes it, and
    // Chromium may re-fire beforeinstallprompt within the same page session.
    const seen = () => {
        try {
            return localStorage.getItem(SEEN_KEY) === '1';
        }
        catch {
            return false; /* private mode */
        }
    };
    let deferred = null;
    addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault(); // suppress the mini-infobar; we drive our own
        deferred = e;
        if (!seen())
            showBanner('install', () => { void deferred?.prompt(); deferred = null; });
    });
    addEventListener('appinstalled', () => {
        try {
            localStorage.setItem(SEEN_KEY, '1');
        }
        catch { /* private mode */ }
        document.getElementById('af-pwa')?.remove();
    });
    // iOS never fires beforeinstallprompt → show the manual hint shortly after
    // landing (once), giving the page a moment to settle first.
    if (isIos() && !seen())
        setTimeout(() => { if (!isStandalone() && !seen())
            showBanner('ios'); }, 2500);
};

/**
 * On-screen touch controls for phones/tablets. Auto-detects iOS/Android (or any
 * coarse-pointer device) and, when present, overlays an MvC-style pad: an 8-way
 * motion stick on the left (so quarter-circle / dragon-punch motions roll
 * naturally) and the six attack buttons on the right, plus START/BACK for menus.
 *

 * dispatches synthetic `KeyboardEvent`s for Player-0's existing key bindings, so
 * the sim, audio-unlock, and menu handling all run through the exact same path
 * as a physical keyboard. Nothing in the deterministic core is touched.

 * global pointer tracking keyed by pointerId.

 * hook so main.ts can push the current screen from inside its own game frame

 * grounded (big, readable characters) and pulls back on super jumps / air
 * combos so nobody leaves the frame (spec §4: MvC-style vertical follow).
 * Solves for the zoom that fits the action box, then places the camera so the
 * box lands between the HUD and the bottom edge.
 */
const updateCamera = (g) => {
    const x0 = px(g.fighters[0].x), x1 = px(g.fighters[1].x);
    const PAD_X = 150; // breathing room either side
    const boxL = Math.min(x0, x1) - PAD_X;
    const boxR = Math.max(x0, x1) + PAD_X;
    const highestFeet = Math.min(px(g.fighters[0].y), px(g.fighters[1].y));
    const boxT = highestFeet - FIGHTER_H - 50; // head + headroom
    const boxB = STAGE.floorYPx + 24; // a little deck below the feet
    // Stage art bounds the camera: it may not zoom out past the point where the
    // viewport would exceed the art (`limits.minZoom`), and cam.y is clamped so
    // the art always covers top and bottom — no flat sky/deck fill ever shows.
    const limits = currentStageCamLimits();
    const zoomFloor = limits ? Math.max(ZOOM_MIN, limits.minZoom) : ZOOM_MIN;
    const zoomX = VW / Math.max(1, boxR - boxL);
    const zoomY = (CONTENT_BOT - CONTENT_TOP) / Math.max(1, boxB - boxT);
    const targetZoom = Math.max(zoomFloor, Math.min(ZOOM_MAX, Math.min(zoomX, zoomY)));
    cam.zoom += (targetZoom - cam.zoom) * 0.08;
    // Place the camera so the action box sits inside the content band.
    const viewW = VW / cam.zoom;
    const viewH = VH / cam.zoom;
    const midX = (x0 + x1) / 2;
    const targetX = Math.max(0, Math.min(STAGE.widthPx - viewW, midX - viewW / 2));
    let targetY = boxT - CONTENT_TOP / cam.zoom;
    if (limits) {
        // Keep the art covering: its top must be at/above the screen top and its
        // bottom at/below the screen bottom. minZoom guarantees viewH ≤ art height,
        // so the [top, bottom-viewH] window is non-empty and this pins the image's
        // bottom edge to the screen bottom once fully zoomed out.
        const maxY = limits.botY - viewH;
        targetY = Math.max(limits.topY, Math.min(maxY, targetY));
    }
    cam.x += (targetX - cam.x) * 0.16;
    cam.y += (targetY - cam.y) * 0.12;
};

        emitRing(sx, sy, 160, P_COLORS[su], { life: 28, width: 6, layer: 'world' });

const renderFight = (g) => {

    // fighter is charged (super meter) or in critical health — the "this
    // fighter is dangerous / desperate" read, tinted to the player color.
    for (const i of [0, 1]) {
        const f = g.fighters[i];
        const meterN = f.meter / TUNING.meterMax;
        const critical = f.health / fighters[i].ch.b.maxHealth < 0.25;
        const intensity = 0.12 + meterN * 0.4 + (critical ? 0.3 : 0);
        const breathe = fxPulse(g.tick, 0.12, 0.8, 1); // subtle living pulse
        auraGlow(ctx, px(f.x), px(f.y) - 52, 70, critical ? DANGER_RED : P_COLORS[i], intensity * breathe);

    const order = g.fighters[0].action === 10 /* Action.Hitstun */ ? [1, 0] : [0, 1];

        const height = STAGE.floorYPx - px(f.y);

        const spd = (Math.abs(f.velX) + Math.abs(f.velY)) / 256;
        const motion = Math.max(0, Math.min(1, (spd - 3) / 7));

        if (!taps.has(`pick:${k}`))
            continue;
        if (!enabled(k) || locked[0])
            break;

            tapConfirm = true; // second tap on the same fighter
        else
            picks[0] = k;

    if (mode === 'cpu') {

            lever = Math.max(-10, lever - 1);
            saveLever(lever);
        }
        if (pressedThisFrame.has('BracketRight')) {
            lever = Math.min(10, lever + 1);
            saveLever(lever);
        }

            move(1, -1);
        if (pressedThisFrame.has('ArrowRight'))
            move(1, 1);

        return;

        ctx.fillText(failed
            ? (solo ? 'ENTER: FREE PRACTICE (no fee · no XP · no records)  ·  ESC: back'
                : 'is the match server running?  npm run server  ·  ESC: back')
            : 'humans and agents share this queue  ·  ESC: cancel', VW / 2, VH / 2 + 24);
        drawWalletStrip();
        if (net?.setup && !netInstalled)
            installOnlineMatch();
        if (failed && solo && pressedThisFrame.has('Enter')) {
            // Server unreachable → the old local match, explicitly reward-free.
            practiceFree = true;
            net?.close();
            net = null;
            const en = allRosters.map((r, i) => (r.disabled ? -1 : i)).filter((i) => i >= 0);
            picks[1] = en[(seed * 13 + uiTick) % en.length] ?? picks[0];
            startFight();
        }
        else if (pressedThisFrame.has('Escape')) {
            net?.close();
            net = null;
            screen = 'select';
            locked = [false, false];
        }
    }
    else if (screen === 'fight' && game) {
        if (pressedThisFrame.has('KeyB'))
            showBoxes = !showBoxes;
        if (pressedThisFrame.has('Escape')) {
            net?.close(); // online: leaving is a forfeit (ADR 0003)
            net = null;
            screen = 'select';
            locked = [false, false];
            void audio.playBgm('player_select', { fadeInSec: 0.5 });
        }
        // Stakes card: shown for the first ~2.5s; any key skips. Solo and local
        // matches HOLD the sim under it (nothing is waiting on us); wager keeps
        // stepping — the peer's card runs on the same clock and rollback absorbs
        // the difference if one side skips early.
        const cardUp = vsCardAge >= 0 && vsCardAge < VS_CARD_TICKS;
        if (cardUp && pressedThisFrame.size > 0 && vsCardAge > 20)
            vsCardAge = VS_CARD_TICKS;
        const holdSim = cardUp && net?.setup?.mode !== 'wager';
        if (net && !holdSim) {
            net.frame(pollPad(P0_MAP)); // session owns stepping (rollback or local-sim)
            if (net.status === 'error' && !net.result) {
                // Connection died mid-match: back out gracefully.
                fx.announce = 'CONNECTION LOST';
                fx.announceAge = 0;
            }
        }
        else if (!net && !holdSim) {
            const p2 = cpuAi ? aiPoll(cpuAi, game) : pollPad(P1_MAP);
            step(game, [pollPad(P0_MAP), p2]);
        }
        updateJuice(game);
        updateCamera(game);
        renderFight(game);
        if (cardUp && fighters) {
            drawVsCard(ctx, fighters, net?.setup ? net.setup.names : [fighters[0].bundle.name, cpuAi ? `AGENT LV ${cpuLevelFor(profile, lever)}` : fighters[1].bundle.name], vsStakes.filter((s) => s), vsCardAge);
            vsCardAge++;
        }
        else if (vsCardAge >= 0) {
            vsCardAge = -1;
        }
        if (game.phase === 1 /* Phase.Fighting */ && !hurryPlayed && game.timerTicks <= HURRY_UP_TICKS) {
            hurryPlayed = true;
            void audio.playStinger('hurry_up', { duck: false }); // layers over the stage loop, like the arcade original
        }
        if (game.phase === 3 /* Phase.MatchOver */) {
            // Progression is SERVER-AWARDED (M5): ranked/wager XP + credits arrive
            // in the post-result xp message. Free practice pays nothing by design.
            // Stale fight-screen state (a lingering "K.O." banner, a frozen combo
            // counter) must not bleed into the results screen's own layout.
            fx.announce = '';
            fx.comboOwner = -1;
            resultsAge = 0;
            screen = 'results';
            // CPU beat the human → arcade "Game Over"; anything else (human win,
            // 2P vs 2P, a draw) gets the victory jingle.
            const lostToCpu = Boolean(cpuAi) && game.winner === 1;
            void audio.playStinger(lostToCpu ? 'game_over' : 'win', {
                onEnded: () => void audio.playBgm('ranking', { fadeInSec: 1 }),
            });
        }
    }
    else if (screen === 'results' && game) {
        resultsAge++;
        // Online progression is SERVER-AWARDED (Phase B): the xp message lands
        // after the verified result, only for signed-in players.
        if (net?.xp && !xpBanner) {
            xpBanner = {
                gained: net.xp.gained, levelsUp: net.xp.levelsUp,
                level: net.xp.level, xp: net.xp.xp, xpNeed: xpForNext(net.xp.level),
                wins: net.xp.wins, losses: net.xp.losses,
                creditsDelta: net.xp.creditsDelta, credits: net.xp.credits,
            };
            // Keep the title-screen chip in sync without a refetch.
            if (account) {
                account = {
                    ...account, credits: net.xp.credits, level: net.xp.level,
                    xp: net.xp.xp, wins: net.xp.wins, losses: net.xp.losses,
                };
            }
        }
        renderFight(game);
        drawResults(ctx, game, fighters, uiTick, resultsAge, xpBanner, net
            ? `TAP / ENTER: REMATCH · ${queuedMode === 'solo' ? '1 CR' : '10 CR'}        ESC: CHANGE FIGHTER`
            : undefined);
        // Online: the server's verdict is the real result (ADR 0003).
        if (net) {
            ctx.font = 'bold 15px "Courier New", monospace';
            ctx.textAlign = 'center';
            if (net.result) {
                const ok = net.result.reason === 'verified';
                const pot = net.setup?.mode === 'wager' && (net.setup.fee ?? 0) > 0
                    ? ` · POT ${(net.setup.fee ?? 0) * 2} CR` : '';
                ctx.fillStyle = ok ? '#7ee85a' : '#ffd166';
                ctx.fillText(ok ? `✓ SERVER-VERIFIED RESULT · ${net.result.rounds[0]}-${net.result.rounds[1]}${pot}`
                    : `RESULT: ${net.result.reason.toUpperCase()}`, VW / 2, VH - 44);
            }
            else {
                ctx.fillStyle = '#ffffff88';
                ctx.fillText('VERIFYING WITH SERVER…', VW / 2, VH - 44);
            }
        }
        drawWalletStrip();
        // 'back' overlaps the full-screen 'start' region, so check it first.
        if (pressedThisFrame.has('Escape') || taps.has('back')) {
            net?.close();
            net = null;
            screen = 'select';
            locked = [false, false];
            void audio.playBgm('player_select', { fadeInSec: 0.5 });
        }
        else if (pressedThisFrame.has('Enter') || taps.has('start')) {
            // INSTANT REMATCH (P0): one input → straight back into the queue with
            // the same fighter and mode. No select detour, no re-confirm.
            if (net) {
                const again = queuedMode;
                net.close();
                net = null;
                startOnline(again);
            }
            else {
                startFight();
            }
        }
    }
    // The arcade overlay belongs to the match only — push the screen this frame
    // ended on, so it appears/disappears in lockstep with what was just drawn.
    setTouchScreen(screen);
    pressedThisFrame.clear();
    taps.clear();
};
// ---------------------------------------------------------------- loop
let last = performance.now();
let acc = 0;
// Perf overlay (F): live FPS (rAF cadence), frame cost (sim+render ms), and
// the netcode stall counter — the triage tool for "the game feels slow":
// low FPS = this machine/browser; high ms/f = our renderer; stalls = network.
let perfShow = false;
let perfFps = 60;
let perfMs = 0;
addEventListener('keydown', (e) => { if (e.code === 'KeyF')
    perfShow = !perfShow; });
const drawPerf = () => {
    const stalled = net ? net.stalled : 0;
    const txt = `${perfFps.toFixed(0)} FPS  ·  ${perfMs.toFixed(1)} ms/f${net ? `  ·  stall ${stalled}` : ''}`;
    ctx.save();
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.textAlign = 'right';
    const w = ctx.measureText(txt).width + 14;
    ctx.fillStyle = '#000000aa';
    ctx.fillRect(VW - w - 6, VH - 40, w, 18);
    ctx.fillStyle = perfFps > 55 ? '#7ee85a' : perfFps > 40 ? '#ffd166' : '#ff6b6b';
    ctx.fillText(txt, VW - 13, VH - 27);
    ctx.restore();
};
const loop = (now) => {
    const rafDt = now - last;
    acc = Math.min(acc + rafDt, 200); // tab-switch guard
    last = now;
    perfFps += ((1000 / Math.max(1, rafDt)) - perfFps) * 0.05; // EMA
    let ran = false;
    const t0 = performance.now();
    while (acc >= TICK_MS) {
        frame();
        acc -= TICK_MS;
        ran = true;
    }
    if (ran)
        perfMs += (performance.now() - t0 - perfMs) * 0.1; // EMA
    if (!ran && screen === 'loading')
        frame(); // keep the loading screen painted
    if (perfShow)
        drawPerf();
    requestAnimationFrame(loop);
};
void boot();
requestAnimationFrame(loop);
/**
 * Console/automation hooks. `afStep(n)` advances exactly n frames without
 * rAF — the hook automated visual tests and headless screenshots drive
 * (browsers throttle rAF to zero in hidden tabs). Replay export lands here
 * later; the input log is already the full match record.
 */
Object.assign(globalThis, {
    afGame: () => game,
    afRosters: () => allRosters,
    afScreen: () => screen,
    afCam: () => ({ ...cam }),
    afStep: (n = 1) => { for (let k = 0; k < n; k++)
        frame(); },
    afPress: (code) => { pressedThisFrame.add(code); keys.add(code); },
    afRelease: (code) => { keys.delete(code); },
    afMode: (m) => { if (m)
        mode = m; return mode; },
    afProfile: () => ({ ...profile, lever }),
    afAccount: () => (account ? { ...account, fetch: accountFetch } : { fetch: accountFetch }),
    afSetLever: (v) => { lever = Math.max(-10, Math.min(10, v | 0)); saveLever(lever); },
    afNet: () => (net ? {
        status: net.status, error: net.error, setup: net.setup, result: net.result,
        stalled: net.stalled, side: net.side,
    } : null),
});
// Mobile: auto-detect touch devices and lay the on-screen controls over the
// canvas; register the PWA + offer install on the first landing. Both are
// no-ops on desktop / when already installed. Runs after afScreen (above) is
// exposed so the overlay can sync its visibility to the current game screen.
initPwa();
initTouchControls();
</script>
</body>
</html>
