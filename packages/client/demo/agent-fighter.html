// ---- core/src/fp.js ----
/**
 * Fixed-point math. All sim positions/velocities are integers in 1/256 px
 * ("subpixels", 24.8 fixed point). Determinism rule: the sim NEVER stores or
 * computes with floats. JS doubles represent integers exactly up to 2^53,
 * and all our products stay far below that, so integer math here is
 * bit-identical across engines/platforms.
 */
const FP = 256;
/** Convert whole pixels to fixed-point. */
const fp = (px) => Math.trunc(px * FP);
/** Fixed-point multiply: (a * b) / FP, truncated toward zero. */
const fpMul = (a, b) => Math.trunc((a * b) / FP);
/** Truncate toward zero to pixels (for rendering / hitbox rects only). */
const fpToPx = (v) => Math.trunc(v / FP);
/** Clamp integer value. */
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
/**
 * Deterministic PRNG (mulberry32-style, integer-only variant).
 * Lives inside GameState; never use Math.random in the sim.
 */
const nextRand = (seed) => {
    let t = (seed + 0x6d2b79f5) | 0;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t = (t + Math.imul(t ^ (t >>> 7), t | 61)) | 0;
    return (t ^ (t >>> 14)) >>> 0;
};

// ---- core/src/input.js ----
const PUNCH_MASK = 16 /* Btn.LP */ | 32 /* Btn.MP */ | 64 /* Btn.HP */;
const KICK_MASK = 128 /* Btn.LK */ | 256 /* Btn.MK */ | 512 /* Btn.HK */;
const ATTACK_MASK = PUNCH_MASK | KICK_MASK;
const DIR_MASK = 1 /* Btn.Left */ | 2 /* Btn.Right */ | 4 /* Btn.Up */ | 8 /* Btn.Down */;
const held = (f, b) => (f & b) !== 0;
/** Rising edge: pressed this frame, not held last frame. */
const pressed = (now, prev, b) => (now & b) !== 0 && (prev & b) === 0;
/** All attack buttons newly pressed this frame, as a mask. */
const pressedAttacks = (now, prev) => now & ~prev & ATTACK_MASK;
/** Popcount for small masks (attack buttons). Deterministic integer loop. */
const countBits = (v) => {
    let n = 0;
    while (v !== 0) {
        n += v & 1;
        v >>>= 1;
    }
    return n;
};

// ---- core/src/data.js ----
// ---------------------------------------------------------------------------
// Loaded character: bundle + precomputed lookup tables the sim uses per tick.
// Built once at load; all lookups by integer index (deterministic).
// ---------------------------------------------------------------------------
const BUTTON_BITS = {
    LP: 16 /* Btn.LP */, MP: 32 /* Btn.MP */, HP: 64 /* Btn.HP */, LK: 128 /* Btn.LK */, MK: 256 /* Btn.MK */, HK: 512 /* Btn.HK */,
};
/** Resolution priority when several buttons are pressed the same frame. */
const BUTTON_PRIORITY = ['HP', 'HK', 'MP', 'MK', 'LP', 'LK'];
const STANCE_IDX = { stand: 0, crouch: 1, air: 2 };
const bitPos = (bit) => {
    let p = 0;
    while ((bit >>= 1) !== 0)
        p++;
    return p;
};
/** Validate + index a character bundle. Throws on malformed data. */
const loadCharacter = (b) => {
    const n = b.moves.length;
    const moveIdxById = {};
    b.moves.forEach((m, i) => {
        if (moveIdxById[m.id] !== undefined)
            throw new Error(`duplicate move id: ${m.id}`);
        if (m.steps.length === 0)
            throw new Error(`move ${m.id} has no steps`);
        for (const st of m.steps) {
            if (!Number.isInteger(st.frames) || st.frames <= 0) {
                throw new Error(`move ${m.id}: step frames must be positive integers`);
            }
        }
        moveIdxById[m.id] = i;
    });
    const normals = [new Int32Array(10).fill(-1), new Int32Array(10).fill(-1), new Int32Array(10).fill(-1)];
    const specials = [];
    let superIdx = -1;
    const totalFrames = new Int32Array(n);
    const firstActiveStep = new Int32Array(n).fill(-1);
    b.moves.forEach((m, i) => {
        totalFrames[i] = m.steps.reduce((acc, s) => acc + s.frames, 0);
        const act = m.steps.findIndex((s) => s.phase === 'active');
        firstActiveStep[i] = act;
        if (m.type === 'normal') {
            if (!m.button)
                throw new Error(`normal ${m.id} missing button`);
            normals[STANCE_IDX[m.stance]][bitPos(BUTTON_BITS[m.button])] = i;
        }
        else if (m.type === 'special') {
            if (!m.motion || !m.buttons || m.buttons === 'PP')
                throw new Error(`special ${m.id} needs motion + P/K`);
            specials.push({ motion: m.motion, kind: m.buttons, idx: i });
        }
        else if (m.type === 'super') {
            if (!m.motion || m.buttons !== 'PP')
                throw new Error(`super ${m.id} needs motion + PP`);
            if (m.meterCost === undefined)
                throw new Error(`super ${m.id} missing meterCost`);
            superIdx = i;
        }
    });
    const cancelHit = new Uint8Array(n * n);
    const cancelBlock = new Uint8Array(n * n);
    for (const edge of b.cancels) {
        const from = moveIdxById[edge.from];
        if (from === undefined)
            throw new Error(`cancel edge from unknown move: ${edge.from}`);
        for (const toId of edge.to) {
            const to = moveIdxById[toId];
            if (to === undefined)
                throw new Error(`cancel edge to unknown move: ${toId}`);
            if (edge.on.includes('hit'))
                cancelHit[from * n + to] = 1;
            if (edge.on.includes('block'))
                cancelBlock[from * n + to] = 1;
        }
    }
    return { b, moveIdxById, normals, specials, superIdx, totalFrames, firstActiveStep, cancelHit, cancelBlock };
};

// ---- core/src/motion.js ----
/**
 * Motion input parsing. Each fighter keeps a ring buffer of numpad-notation
 * directions (facing-relative, 6 = toward opponent) in GameState. On every
 * attack-button press the parser scans the recent window for 623 / 236 / 214
 * — lenient, MvC style: the motion matches as a subsequence, diagonals
 * optional. All integer math over serialized state; fully deterministic.
 */
const HIST_LEN = 16; // ring buffer length (> motionWindowTicks)
/** Current direction as numpad notation, relative to facing (6 = forward). */
const numpadDir = (input, facing) => {

                return { xp: p.xp, level: Math.max(1, p.level), wins: p.wins | 0, losses: p.losses | 0 };

const CONTENT_BOT = VH - 12;

// ---------------------------------------------------------------- palette
const GOLD = '#d9a441';
const GOLD_LT = '#f7e0a3';
const GOLD_DK = '#8a5f1e';
const PANEL = '#14121f';
const PANEL_LT = '#2a2438';
const HP_HI = '#7ee85a';

const METER_HI = '#6fd3ff';
const METER_FULL = '#ffd166';

// ---------------------------------------------------------------- easing
/** Ease-out cubic — snappy start, soft landing. Used for pop-ins. */
const easeOutCubic = (t) => 1 - (1 - t) ** 3;

const easeOutBack = (t) => {

const clamp01 = (v) => Math.max(0, Math.min(1, v));

/** Beveled plate: the workhorse of the arcade frame look. */
const bevel = (ctx, x, y, w, h, fill, light = GOLD_LT, dark = GOLD_DK, t = 2) => {
    ctx.fillStyle = fill;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = light;
    ctx.fillRect(x, y, w, t); // top
    ctx.fillRect(x, y, t, h); // left
    ctx.fillStyle = dark;
    ctx.fillRect(x, y + h - t, w, t); // bottom
    ctx.fillRect(x + w - t, y, t, h); // right

/**
 * Clean condensed-bold label text — nameplates, hints, HUD numbers. Same
 * type family as the display treatment (Anton) for a cohesive "one game, one
 * font" arcade look, but flat (no skew/outline) so small/fast-changing text
 * stays crisp and legible.

const label = (ctx, s, x, y, size, color, align = 'center', shadow = true) => {
    ctx.font = `${size}px ${DISPLAY_FONT_STACK}`;
    ctx.textAlign = align;
    ctx.textBaseline = 'alphabetic';

/** @deprecated alias kept for readability at call sites migrated gradually. */
const text = label;
/**
 * SF-style display type: italic-sheared Anton, heavy dark outline, warm
 * vertical gradient fill, thin bright rim for pop. Used for anything that
 * should feel like arcade-cabinet marquee text — logo, round announcements,
 * results title, combo counter, level-up banner.
 */
const display = (ctx, s, x, y, size, opts = {}) => {
    const { align = 'center', skew = 0.16, from = '#fff8e6', mid = '#ffd166', to = '#c9781a', outline = '#33101a', rim = 'rgba(255,255,255,0.55)', glow, glowBlur = 18, scale = 1, alpha = 1, } = opts;
    ctx.save();

    if (scale !== 1)
        ctx.scale(scale, scale);
    ctx.transform(1, 0, -skew, 1, 0, 0);
    ctx.font = `${size}px ${DISPLAY_FONT_STACK}`;
    ctx.textAlign = align;
    ctx.textBaseline = 'alphabetic';
    ctx.lineJoin = 'round';
    ctx.miterLimit = 2;
    if (glow) {
        ctx.shadowColor = glow;
        ctx.shadowBlur = glowBlur;
    }
    ctx.strokeStyle = outline;
    ctx.lineWidth = Math.max(2, size * 0.16);
    ctx.strokeText(s, 0, 0);
    ctx.shadowBlur = 0; // glow only wants the outline pass, not a double-blur on fill
    const g = ctx.createLinearGradient(0, -size * 0.78, 0, size * 0.12);
    g.addColorStop(0, from);
    g.addColorStop(0.5, mid);
    g.addColorStop(1, to);
    ctx.fillStyle = g;
    ctx.fillText(s, 0, 0);
    ctx.strokeStyle = rim;
    ctx.lineWidth = Math.max(1, size * 0.035);
    ctx.strokeText(s, 0, 0);
    ctx.restore();
};
const DANGER_OPTS = { from: '#ffe3e6', mid: '#ff6b81', to: '#8f1626', outline: '#2a0810' };
const COOL_OPTS = { from: '#eaf6ff', mid: '#7fd0ff', to: '#1a5f8f', outline: '#0a1a2a' };
// ---------------------------------------------------------------- stage
/**
 * Rooftop at sunset: parallax skyline, chain-link fence, tiled deck.
 * Drawn in WORLD coordinates — call under worldTransform(). Parallax layers
 * counter-shift by the camera so distant things drift slower.
 */
const drawStage = (ctx, cam) => {
    const viewW = VW / cam.zoom;
    const viewH = VH / cam.zoom;
    const L = cam.x, R = cam.x + viewW, T = cam.y, B = cam.y + viewH;
    const floorY = STAGE.floorYPx;
    // Image stage (stages/<id>/, single flat background OR parallax layers) —
    // the procedural rooftop below is only the fallback for a checkout with
    // no stage assets at all.
    if (stageAsset && (stageAsset.image || stageAsset.layers.length > 0)) {
        drawStageLayers(ctx, stageAsset, cam, VW, VH);
        ctx.fillStyle = 'rgba(16, 10, 28, 0.18)'; // veil: fighters pop
        ctx.fillRect(L - 10, T - 10, viewW + 20, viewH + 20);
        return;
    }
    // Sky.
    const sky = ctx.createLinearGradient(0, T, 0, floorY);
    sky.addColorStop(0, '#2b1b4d');
    sky.addColorStop(0.42, '#6a2f6b');
    sky.addColorStop(0.75, '#c05a5a');
    sky.addColorStop(1, '#f0a35e');
    ctx.fillStyle = sky;
    ctx.fillRect(L - 10, T - 10, viewW + 20, floorY - T + 20);
    // Sun (very slow parallax).
    ctx.fillStyle = '#ffd9a0';
    ctx.beginPath();
    ctx.arc(STAGE.widthPx * 0.5 + cam.x * 0.72, floorY - 120, 54, 0, Math.PI * 2);
    ctx.fill();
    // Far skyline.
    ctx.fillStyle = '#3a2352';
    for (let i = 0; i < 30; i++) {
        const bw = 54 + ((i * 37) % 40);
        const bh = 90 + ((i * 53) % 120);
        const x = i * 90 + cam.x * 0.35; // counter-shift = slower drift
        if (x > R + 60 || x + bw < L - 60)
            continue;
        ctx.fillRect(x, floorY - bh, bw, bh);
    }
    // Near skyline + lit windows.
    for (let i = 0; i < 26; i++) {
        const bw = 70 + ((i * 29) % 46);
        const bh = 140 + ((i * 71) % 130);
        const bx = i * 110 + 30 + cam.x * 0.16;
        if (bx > R + 80 || bx + bw < L - 80)
            continue;
        const by = floorY - bh;
        ctx.fillStyle = '#241638';
        ctx.fillRect(bx, by, bw, bh);
        ctx.fillStyle = '#ffcf7a44';
        for (let wy = by + 12; wy < by + bh - 10; wy += 22) {
            for (let wxx = bx + 8; wxx < bx + bw - 10; wxx += 18) {
                if ((Math.trunc(wxx) * 7 + Math.trunc(wy) * 13 + i) % 3 === 0)
                    ctx.fillRect(wxx, wy, 7, 10);
            }
        }
    }
    // Chain-link fence (world-locked, behind the fighters).
    const fenceTop = floorY - 118;
    ctx.strokeStyle = '#2a243888';
    ctx.lineWidth = 1;
    const startX = Math.floor((L - 20) / 14) * 14;
    for (let wx = startX; wx < R + 20; wx += 14) {
        ctx.beginPath();
        ctx.moveTo(wx, fenceTop);
        ctx.lineTo(wx + 14, floorY);
        ctx.moveTo(wx + 14, fenceTop);
        ctx.lineTo(wx, floorY);
        ctx.stroke();
    }
    ctx.strokeStyle = '#4a4260';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(L - 10, fenceTop);
    ctx.lineTo(R + 10, fenceTop);
    ctx.stroke();
    ctx.fillStyle = '#3a3450';
    for (let wx = Math.floor(L / 180) * 180; wx < R + 180; wx += 180) {
        ctx.fillRect(wx, fenceTop, 6, floorY - fenceTop);
    }
    // Roof deck.
    ctx.fillStyle = '#4a4358';
    ctx.fillRect(L - 10, floorY, viewW + 20, Math.max(40, B - floorY + 20));
    ctx.fillStyle = '#3e384a';
    ctx.fillRect(L - 10, floorY, viewW + 20, 5);
    ctx.strokeStyle = '#5a5370';
    ctx.lineWidth = 1;
    for (let wx = Math.floor((L - 200) / 90) * 90; wx < R + 200; wx += 90) {
        ctx.beginPath();
        ctx.moveTo(wx, floorY + 5);
        ctx.lineTo(wx - 60, B + 20);
        ctx.stroke();
    }
    for (let k = 1; k < 5; k++) {
        const y = floorY + 5 + k * k * 6;
        if (y > B + 10)
            break;
        ctx.beginPath();
        ctx.moveTo(L - 10, y);
        ctx.lineTo(R + 10, y);
        ctx.stroke();
    }
    // Puddles catching the sunset.
    ctx.fillStyle = '#c07a6a33';
    for (const [wx, wy, ww] of [[240, 30, 90], [900, 52, 130], [1420, 24, 70]]) {
        ctx.beginPath();
        ctx.ellipse(wx, floorY + wy, ww / 2, 6, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.lineWidth = 1;
    // Atmospheric veil: pushes the stage back so the fighters (drawn next) pop.
    ctx.fillStyle = 'rgba(20, 12, 34, 0.34)';
    ctx.fillRect(L - 10, T - 10, viewW + 20, viewH + 20);
};
// ---------------------------------------------------------------- HUD
/**
 * HUD layout (rows, top-down): health bar · nameplate · pips+meter.
 * Asset sizes derive from the SVG kit geometry (HUD_GEO), scaled to fit the
 * 960px frame: portrait(92) · bar(328) · timer(96) · bar · portrait.
 */
const HUD = {
    edge: 108, // inner start of the bars (portraits live outside this)
    barW: 328,
    barH: 38,
    barY: 12,
    nameW: 226,
    nameH: 25,
    nameY: 56,
    pipY: 90,
    meterY: 88,
    meterSegW: 102,
    meterSegH: 15,
};
const drawHealthBar = (ctx, i, ratio, flashRatio, tick) => {
    const { barW, barH, barY: y } = HUD;
    const x = i === 0 ? HUD.edge : VW - HUD.edge - barW;
    const mirror = i === 1;
    const danger = ratio < 0.25 && ratio > 0;
    const fillBar = (r, style) => {
        const g = HUD_GEO.healthframe;
        ctx.save();
        clipPoly(ctx, HUD_GEO.healthWindow, g.w, g.h, x, y, barW, barH, mirror);
        // MvC drain: remaining health anchors at the OUTER edge; damage eats
        // from the center-facing tip.
        const w = barW * Math.max(0, Math.min(1, r));
        ctx.fillStyle = style;
        ctx.fillRect(i === 0 ? x : x + barW - w, y, w, barH);
        ctx.restore();
    };
    // Low-health urgency: a soft pulsing red glow behind the frame.
    if (danger) {
        const pulse = 0.35 + 0.35 * (0.5 + 0.5 * Math.sin(tick / 8));
        ctx.save();
        ctx.shadowColor = `rgba(233,69,96,${pulse})`;
        ctx.shadowBlur = 16;
        ctx.fillStyle = 'rgba(233,69,96,0.01)'; // near-invisible fill just to cast the shadow
        ctx.fillRect(x - 4, y - 4, barW + 8, barH + 8);
        ctx.restore();
    }
    if (uiKit?.healthframe) {
        // Paint order under the frame: dark tray → damage flash → health → gloss.
        fillBar(1, '#0c0e13');
        fillBar(flashRatio, '#ffffff66');
        const grad = ctx.createLinearGradient(0, y, 0, y + barH);
        grad.addColorStop(0, danger ? '#ff8d9e' : '#b9f66d');
        grad.addColorStop(0.45, danger ? HP_DANGER : HP_HI);
        grad.addColorStop(1, danger ? '#7a1b2b' : HP_LO);
        fillBar(ratio, grad);
        // Gloss line inside the window.
        ctx.save();
        const g = HUD_GEO.healthframe;
        clipPoly(ctx, HUD_GEO.healthWindow, g.w, g.h, x, y, barW, barH, mirror);
        ctx.fillStyle = '#ffffff2e';
        ctx.fillRect(x, y + 3, barW, 6);
        ctx.restore();
        drawChrome(ctx, uiKit.healthframe, x, y, barW, barH, mirror);
        return;
    }
    // Procedural fallback.
    bevel(ctx, x - 3, y - 3, barW + 6, barH + 6, PANEL, GOLD, GOLD_DK, 2);
    const fw = Math.round((barW - 4) * Math.max(0, ratio));
    ctx.fillStyle = '#ffffff55';
    ctx.fillRect(i === 0 ? x + 2 : x + barW - 2 - Math.round((barW - 4) * flashRatio), y + 2, Math.round((barW - 4) * flashRatio), barH - 4);
    ctx.fillStyle = danger ? HP_DANGER : HP_HI;
    ctx.fillRect(i === 0 ? x + 2 : x + barW - 2 - fw, y + 2, fw, barH - 4);
};
const drawMeter = (ctx, i, meter) => {
    const bars = Math.round(TUNING.meterMax / TUNING.meterBar);
    const gap = 6;
    const segW = HUD.meterSegW, segH = HUD.meterSegH;
    const total = bars * segW + (bars - 1) * gap;
    const startX = i === 0 ? HUD.edge : VW - HUD.edge - total;
    const y = HUD.meterY;
    const mirror = i === 1;
    for (let b = 0; b < bars; b++) {
        // Segments fill outward from the screen edge, like the health bar.
        const idx = i === 0 ? b : bars - 1 - b;
        const x = startX + idx * (segW + gap);
        const seg = Math.max(0, Math.min(TUNING.meterBar, meter - b * TUNING.meterBar));
        const ratio = seg / TUNING.meterBar;
        const full = ratio >= 1;
        if (uiKit?.meterseg) {
            const g = HUD_GEO.meterseg;
            ctx.save();
            clipPoly(ctx, HUD_GEO.meterWindow, g.w, g.h, x, y, segW, segH, mirror);
            ctx.fillStyle = '#0c0e13';
            ctx.fillRect(x, y, segW, segH);
            ctx.fillStyle = full ? METER_FULL : METER_HI;
            const w = segW * ratio;
            ctx.fillRect(mirror ? x + segW - w : x, y, w, segH);
            ctx.restore();
            drawChrome(ctx, uiKit.meterseg, x, y, segW, segH, mirror);
        }
        else {
            bevel(ctx, x, y, segW, segH, '#191524', '#4a4260', '#0d0a14', 1);
            ctx.fillStyle = full ? METER_FULL : METER_HI;
            ctx.fillRect(x + 1, y + 1, Math.round((segW - 2) * ratio), segH - 2);
        }
    }
};
const drawPortraitFrame = (ctx, i, roster, lowHealth) => {
    const s = 92;
    const x = i === 0 ? 8 : VW - 8 - s;
    const y = 8;
    const win = HUD_GEO.portraitWindow;
    ctx.save();
    if (lowHealth)
        ctx.filter = 'saturate(0.4) brightness(0.8)';
    if (uiKit?.portrait) {
        drawPortrait(ctx, roster, x + win.x, y + win.y, win.w, win.h);
    }
    else {
        drawPortrait(ctx, roster, x + 4, y + 4, s - 8, s - 8);
    }
    ctx.restore();
    if (uiKit?.portrait)
        drawChrome(ctx, uiKit.portrait, x, y, s, s, i === 1);
    else
        bevel(ctx, x, y, s, s, '#00000000', GOLD, GOLD_DK, 3);
    // Player tag.
    ctx.fillStyle = P_COLORS[i];
    const tagX = i === 0 ? x + 4 : x + s - 30;
    ctx.fillRect(tagX, y + s - 20, 26, 14);

const drawNameplate = (ctx, i, name) => {
    const w = HUD.nameW, h = HUD.nameH;
    const x = i === 0 ? HUD.edge : VW - HUD.edge - w;
    const y = HUD.nameY;
    if (uiKit?.nameplate) {
        drawChrome(ctx, uiKit.nameplate, x, y, w, h, i === 1);
    }
    else {
        bevel(ctx, x, y, w, h, PANEL, GOLD, GOLD_DK, 2);
    }
    label(ctx, name.toUpperCase(), i === 0 ? x + 16 : x + w - 16, y + h - 7, 15, '#e8e4da', i === 0 ? 'left' : 'right');

const drawRoundPips = (ctx, i, wins) => {
    const need = TUNING.roundsToWin;
    const g = HUD_GEO.pip;
    const gap = 7;
    // Sits just inside the nameplate's outer end.
    for (let r = 0; r < need; r++) {
        const x = i === 0
            ? HUD.edge + HUD.nameW + 14 + r * (g.w + gap)
            : VW - HUD.edge - HUD.nameW - 14 - g.w - r * (g.w + gap);
        const on = r < wins;
        if (uiKit?.pipOn && uiKit.pipOff) {
            drawChrome(ctx, on ? uiKit.pipOn : uiKit.pipOff, x, HUD.pipY, g.w, g.h, i === 1);
        }
        else {
            bevel(ctx, x, HUD.pipY, 14, 14, on ? GOLD : '#191524', on ? GOLD_LT : '#4a4260', GOLD_DK, 1);
        }
    }
};
const drawTimer = (ctx, secs, tick) => {
    const s = 96;
    const cx = VW / 2, y = 6;
    const urgent = secs <= 10 && secs > 0;
    // Urgent pulse: a small scale breathing so the last ten seconds read as tense.
    const pulse = urgent ? 1 + 0.06 * Math.sin(tick / 6) : 1;
    ctx.save();
    ctx.translate(cx, y + s / 2);
    ctx.scale(pulse, pulse);
    ctx.translate(-cx, -(y + s / 2));
    if (uiKit?.timer) {
        drawChrome(ctx, uiKit.timer, cx - s / 2, y, s, s);
        label(ctx, String(Math.max(0, secs)).padStart(2, '0'), cx, y + s / 2 + 15, 40, urgent ? HP_DANGER : '#ffffff');
        ctx.restore();
        return;
    }
    const cy = y + s / 2, r = 42;
    const oct = (rr) => {
        ctx.beginPath();
        for (let k = 0; k < 8; k++) {
            const a = (Math.PI / 4) * k + Math.PI / 8;
            ctx.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
        }
        ctx.closePath();
    };
    oct(r);
    ctx.fillStyle = GOLD;
    ctx.fill();
    oct(r - 4);
    ctx.fillStyle = PANEL;
    ctx.fill();
    label(ctx, String(Math.max(0, secs)).padStart(2, '0'), cx, cy + 12, 34, urgent ? HP_DANGER : '#ffffff');
    ctx.restore();
};
const drawHud = (ctx, g, rosters, fx, tags) => {
    for (const i of [0, 1]) {
        const f = g.fighters[i];
        const max = rosters[i].ch.b.maxHealth;
        const ratio = Math.max(0, f.health) / max;
        drawHealthBar(ctx, i, ratio, fx.flash[i], g.tick);
        drawPortraitFrame(ctx, i, rosters[i], ratio < 0.25);
        drawNameplate(ctx, i, rosters[i].bundle.name + (tags?.[i] ? ` · ${tags[i]}` : ''));
        drawRoundPips(ctx, i, i === 0 ? g.roundsWon0 : g.roundsWon1);
        drawMeter(ctx, i, f.meter);
    }
    drawTimer(ctx, Math.ceil(g.timerTicks / TICKS_PER_SEC), g.tick);
    // Combo counter: punches in on each new hit (re-triggered via comboAge
    // reset in main.ts whenever comboHits increases), settles with overshoot.
    if (fx.comboOwner >= 0 && fx.comboHits >= 2) {
        const i = fx.comboOwner;
        const x = i === 0 ? 110 : VW - 110;
        const align = i === 0 ? 'left' : 'right';
        const pop = 0.7 + 0.3 * easeOutBack(clamp01(fx.comboAge / 8));
        display(ctx, `${fx.comboHits}`, x, 200, 46, { align, scale: pop, ...(fx.comboHits >= 6 ? DANGER_OPTS : {}) });
        label(ctx, 'HITS', i === 0 ? x + 62 : x - 62, 200, 20, '#fff', align);
    }
    // Center announcements (ROUND 1 / FIGHT! / KO): pop in with overshoot, hold, fade.
    if (fx.announce) {
        const inT = clamp01(fx.announceAge / 10);
        const scale = 0.5 + 0.5 * easeOutBack(inT);
        const alpha = clamp01(1.6 - fx.announceAge / 60);
        const danger = fx.announce === 'K.O.' || fx.announce === 'DOUBLE KO';
        display(ctx, fx.announce, VW / 2, VH / 2 - 40, 64, {
            scale, alpha, ...(danger ? DANGER_OPTS : {}),
            glow: danger ? 'rgba(233,69,96,0.7)' : 'rgba(255,209,102,0.6)',
        });
    }
    // Controls strip (dark band like the reference).
    ctx.fillStyle = '#0b0a12dd';
    ctx.fillRect(0, VH - 24, VW, 24);
    ctx.fillStyle = '#2e3140';
    ctx.fillRect(0, VH - 24, VW, 1);
    label(ctx, 'P1: WASD · TYU / GHJ        P2: ARROWS · IOP / KL;        B: HITBOXES        ESC: MENU', VW / 2, VH - 8, 11, '#c8c4ba');
};

            ctx.drawImage(img, -96, -176);
            ctx.restore();

        ctx.fillRect(0, 0, VW, VH);
    }
    drawHud(ctx, g, fighters, fx, cpuAi ? ['', `CPU LV ${cpuLevelFor(profile, lever)}`] : undefined);
};
// ---------------------------------------------------------------- screens
const tickSelect = () => {
    const n = allRosters.length;
    const move = (i, d) => {
        if (locked[i])
            return;
        picks[i] = (picks[i] + d + n) % n;
    };
    if (pressedThisFrame.has('KeyA'))
        move(0, -1);
    if (pressedThisFrame.has('KeyD'))
        move(0, 1);
    // The CPU difficulty lever: [ and ] on the select screen (CPU mode).
    if (mode === 'cpu') {
        if (pressedThisFrame.has('BracketLeft')) {
            lever = Math.max(-10, lever - 1);
            saveLever(lever);
        }
        if (pressedThisFrame.has('BracketRight')) {
            lever = Math.min(10, lever + 1);
            saveLever(lever);
        }
    }
    else {
        if (pressedThisFrame.has('ArrowLeft'))
            move(1, -1);
        if (pressedThisFrame.has('ArrowRight'))
            move(1, 1);
    }
    if (CONFIRM[0].some((k) => pressedThisFrame.has(k)))
        locked[0] = true;
    if (mode === '2p') {
        if (CONFIRM[1].some((k) => pressedThisFrame.has(k)))
            locked[1] = true;
    }
    else if (locked[0] && !locked[1]) {
        // CPU picks its fighter — visibly, like an arcade opponent reveal.
        picks[1] = (seed * 17 + profile.wins * 5 + uiTick) % n;
        locked[1] = true;
    }
    if (pressedThisFrame.has('Escape'))
        locked = [false, false];
    if (locked[0] && locked[1] && (pressedThisFrame.has('Enter') || pressedThisFrame.has('Space'))) {
        if (stageIds.length > 0)
            screen = 'stageSelect';
        else
            startFight(); // no stages installed — fall back to the procedural stage
    }
};
const tickStageSelect = () => {
    const n = stageIds.length;
    const move = (d) => {
        stageCursor = (stageCursor + d + n) % n;
        setStageAsset(stageAssets[stageCursor] ?? null);
    };
    if (pressedThisFrame.has('KeyA') || pressedThisFrame.has('ArrowLeft'))
        move(-1);
    if (pressedThisFrame.has('KeyD') || pressedThisFrame.has('ArrowRight'))
        move(1);
    if (pressedThisFrame.has('Escape')) {
        screen = 'select';
        locked = [false, false];
    }
    if (pressedThisFrame.has('Enter') || pressedThisFrame.has('Space'))
        startFight();
};
const frame = () => {
    uiTick++;
    if (screen === 'loading') {
        ctx.fillStyle = '#0a0616';
        ctx.fillRect(0, 0, VW, VH);
        ctx.fillStyle = loadError ? '#e94560' : '#ffffffaa';
        ctx.font = 'bold 18px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(loadError || 'LOADING CHARACTERS…', VW / 2, VH / 2);
        if (loadError) {
            ctx.font = '13px "Courier New", monospace';
            ctx.fillStyle = '#ffffff88';
            ctx.fillText('run `npm run play` from the repo root so characters/ is served', VW / 2, VH / 2 + 28);
        }
    }
    else if (screen === 'title') {
        drawTitle(ctx, allRosters, uiTick, { mode, cpuLevel: cpuLevelFor(profile, lever) });
        if (pressedThisFrame.has('ArrowUp') || pressedThisFrame.has('KeyW')
            || pressedThisFrame.has('ArrowDown') || pressedThisFrame.has('KeyS')) {
            mode = mode === 'cpu' ? '2p' : 'cpu';
        }
        else if (pressedThisFrame.size > 0) {
            screen = 'select';
            locked = [false, false];
        }
    }
    else if (screen === 'select') {
        tickSelect();
        drawSelect(ctx, allRosters, picks, locked, uiTick, mode === 'cpu' ? { cpuLevel: cpuLevelFor(profile, lever), lever } : undefined);
    }
    else if (screen === 'stageSelect') {
        tickStageSelect();
        drawStageSelect(ctx, stageIds, stageCursor, uiTick);
    }
    else if (screen === 'fight' && game) {
        if (pressedThisFrame.has('KeyB'))
            showBoxes = !showBoxes;
        if (pressedThisFrame.has('Escape')) {
            screen = 'select';
            locked = [false, false];
        }
        const p2 = cpuAi ? aiPoll(cpuAi, game) : pollPad(P1_MAP);
        step(game, [pollPad(P0_MAP), p2]);
        updateJuice(game);
        updateCamera(game);
        renderFight(game);
        if (game.phase === 3 /* Phase.MatchOver */) {
            if (cpuAi && !xpBanner) {
                const award = awardXp(profile, {
                    won: game.winner === 0,
                    damageDealt: statDmg,
                    bestCombo: statBestCombo,
                });
                xpBanner = {
                    gained: award.gained, levelsUp: award.levelsUp,
                    level: profile.level, xp: profile.xp, xpNeed: xpForNext(profile.level),
                    wins: profile.wins, losses: profile.losses,
                };
            }
            // Stale fight-screen state (a lingering "K.O." banner, a frozen combo
            // counter) must not bleed into the results screen's own layout.
            fx.announce = '';
            fx.comboOwner = -1;
            resultsAge = 0;
            screen = 'results';
        }
    }
    else if (screen === 'results' && game) {
        resultsAge++;
        renderFight(game);
        drawResults(ctx, game, fighters, uiTick, resultsAge, xpBanner);
        if (pressedThisFrame.has('Enter'))
            startFight();
        if (pressedThisFrame.has('Escape')) {
            screen = 'select';
            locked = [false, false];
        }
    }
    pressedThisFrame.clear();
};
// ---------------------------------------------------------------- loop
let last = performance.now();
let acc = 0;
const loop = (now) => {
    acc = Math.min(acc + (now - last), 200); // tab-switch guard
    last = now;
    let ran = false;
    while (acc >= TICK_MS) {
        frame();
        acc -= TICK_MS;
        ran = true;
    }
    if (!ran && screen === 'loading')
        frame(); // keep the loading screen painted
    requestAnimationFrame(loop);
};
void boot();
requestAnimationFrame(loop);
/**
 * Console/automation hooks. `afStep(n)` advances exactly n frames without
 * rAF — the hook automated visual tests and headless screenshots drive
 * (browsers throttle rAF to zero in hidden tabs). Replay export lands here
 * later; the input log is already the full match record.
 */
Object.assign(globalThis, {
    afGame: () => game,
    afRosters: () => allRosters,
    afScreen: () => screen,
    afCam: () => ({ ...cam }),
    afStep: (n = 1) => { for (let k = 0; k < n; k++)
        frame(); },
    afPress: (code) => { pressedThisFrame.add(code); keys.add(code); },
    afRelease: (code) => { keys.delete(code); },
    afMode: (m) => { if (m)
        mode = m; return mode; },
    afProfile: () => ({ ...profile, lever }),
    afSetLever: (v) => { lever = Math.max(-10, Math.min(10, v | 0)); saveLever(lever); },
});
</script>
</body>
