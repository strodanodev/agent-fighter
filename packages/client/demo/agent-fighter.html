// ---- core/src/fp.js ----
/**
 * Fixed-point math. All sim positions/velocities are integers in 1/256 px
 * ("subpixels", 24.8 fixed point). Determinism rule: the sim NEVER stores or
 * computes with floats. JS doubles represent integers exactly up to 2^53,
 * and all our products stay far below that, so integer math here is
 * bit-identical across engines/platforms.
 */
const FP = 256;
/** Convert whole pixels to fixed-point. */
const fp = (px) => Math.trunc(px * FP);
/** Fixed-point multiply: (a * b) / FP, truncated toward zero. */
const fpMul = (a, b) => Math.trunc((a * b) / FP);
/** Truncate toward zero to pixels (for rendering / hitbox rects only). */
const fpToPx = (v) => Math.trunc(v / FP);
/** Clamp integer value. */
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
/**
 * Deterministic PRNG (mulberry32-style, integer-only variant).
 * Lives inside GameState; never use Math.random in the sim.
 */
const nextRand = (seed) => {
    let t = (seed + 0x6d2b79f5) | 0;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t = (t + Math.imul(t ^ (t >>> 7), t | 61)) | 0;
    return (t ^ (t >>> 14)) >>> 0;
};

// ---- core/src/input.js ----
/** All three drink-slot bits, slot-indexed. */
const ITEM_BITS = [1024 /* Btn.Item */, 2048 /* Btn.Item2 */, 4096 /* Btn.Item3 */];
const PUNCH_MASK = 16 /* Btn.LP */ | 32 /* Btn.MP */ | 64 /* Btn.HP */;
const KICK_MASK = 128 /* Btn.LK */ | 256 /* Btn.MK */ | 512 /* Btn.HK */;
const ATTACK_MASK = PUNCH_MASK | KICK_MASK;
const DIR_MASK = 1 /* Btn.Left */ | 2 /* Btn.Right */ | 4 /* Btn.Up */ | 8 /* Btn.Down */;
const held = (f, b) => (f & b) !== 0;
/** Rising edge: pressed this frame, not held last frame. */
const pressed = (now, prev, b) => (now & b) !== 0 && (prev & b) === 0;
/** All attack buttons newly pressed this frame, as a mask. */
const pressedAttacks = (now, prev) => now & ~prev & ATTACK_MASK;
/** Popcount for small masks (attack buttons). Deterministic integer loop. */
const countBits = (v) => {
    let n = 0;
    while (v !== 0) {
        n += v & 1;
        v >>>= 1;
    }
    return n;
};

// ---- core/src/data.js ----
// ---------------------------------------------------------------------------
// Loaded character: bundle + precomputed lookup tables the sim uses per tick.
// Built once at load; all lookups by integer index (deterministic).
// ---------------------------------------------------------------------------
const BUTTON_BITS = {
    LP: 16 /* Btn.LP */, MP: 32 /* Btn.MP */, HP: 64 /* Btn.HP */, LK: 128 /* Btn.LK */, MK: 256 /* Btn.MK */, HK: 512 /* Btn.HK */,
};
/** Resolution priority when several buttons are pressed the same frame. */
const BUTTON_PRIORITY = ['HP', 'HK', 'MP', 'MK', 'LP', 'LK'];
const STANCE_IDX = { stand: 0, crouch: 1, air: 2 };
const bitPos = (bit) => {
    let p = 0;
    while ((bit >>= 1) !== 0)
        p++;
    return p;
};
/** Validate + index a character bundle. Throws on malformed data. */
const loadCharacter = (b) => {
    const n = b.moves.length;
    const moveIdxById = {};
    b.moves.forEach((m, i) => {
        if (moveIdxById[m.id] !== undefined)
            throw new Error(`duplicate move id: ${m.id}`);
        if (m.steps.length === 0)
            throw new Error(`move ${m.id} has no steps`);
        for (const st of m.steps) {
            if (!Number.isInteger(st.frames) || st.frames <= 0) {
                throw new Error(`move ${m.id}: step frames must be positive integers`);
            }
        }
        moveIdxById[m.id] = i;
    });
    // Value bounds (audit 2026-07-18 validation holes + 2026-07-20 CT-3-adjacent
    // soft-lock). The structure is validated above; these reject NUMERIC data
    // that would silently SOFT-LOCK a match (deterministic on both peers, so it
    // never desyncs — it just freezes) or hand a cheating bundle free resources:
    //  · gravity <= 0 → an airborne fighter never falls;
    //  · throwTossVelY / launchVelY >= 0 → the victim never leaves the ground, so
    //    AirHitstun (which exits only on landing) runs until the round timer;
    //  · negative chip heals, negative juggleCost = infinite combo, negative
    //    meterCost mints meter (health has no upper clamp).
    // Bounds are loose enough that all 12 shipped bundles pass unchanged
    // (verified: gravity 0.8, toss -8, launchVelY -17..-12, chip/juggle/meter >=0).
    const num = (v, what) => {
        if (typeof v !== 'number' || !Number.isFinite(v))
            throw new Error(`${b.name}: ${what} must be a finite number (got ${v})`);
        return v;
    };
    if (num(b.maxHealth, 'maxHealth') <= 0)
        throw new Error(`${b.name}: maxHealth must be > 0 (got ${b.maxHealth})`);
    if (num(b.gravity, 'gravity') <= 0)
        throw new Error(`${b.name}: gravity must be > 0 or fighters never fall (got ${b.gravity})`);
    if (num(b.throwTossVelY, 'throwTossVelY') >= 0)
        throw new Error(`${b.name}: throwTossVelY must be < 0 (upward); a non-upward toss strands the victim in AirHitstun (got ${b.throwTossVelY})`);
    const checkHit = (h, where) => {
        num(h.damage, `${where} damage`);
        if (num(h.chip, `${where} chip`) < 0)
            throw new Error(`${b.name}: ${where} chip must be >= 0; negative chip heals (got ${h.chip})`);
        if (num(h.juggleCost, `${where} juggleCost`) < 0)
            throw new Error(`${b.name}: ${where} juggleCost must be >= 0; negative enables infinite combos (got ${h.juggleCost})`);
        if (h.launchVelY !== undefined && num(h.launchVelY, `${where} launchVelY`) >= 0)
            throw new Error(`${b.name}: ${where} launchVelY must be < 0 (upward); a non-upward launch strands the victim in AirHitstun (got ${h.launchVelY})`);
        if (h.airPopVelY !== undefined)
            num(h.airPopVelY, `${where} airPopVelY`);
    };
    b.moves.forEach((m) => {
        if (m.meterCost !== undefined && num(m.meterCost, `${m.id} meterCost`) < 0)
            throw new Error(`${b.name}: ${m.id} meterCost must be >= 0; negative mints meter (got ${m.meterCost})`);
        for (const st of m.steps)
            for (const h of st.hitboxes ?? [])
                checkHit(h, m.id);
        if (m.projectile)
            checkHit(m.projectile.hit, `${m.id} projectile`);
    });
    const normals = [new Int32Array(10).fill(-1), new Int32Array(10).fill(-1), new Int32Array(10).fill(-1)];
    const specials = [];
    let superIdx = -1;
    const totalFrames = new Int32Array(n);
    const firstActiveStep = new Int32Array(n).fill(-1);
    b.moves.forEach((m, i) => {
        totalFrames[i] = m.steps.reduce((acc, s) => acc + s.frames, 0);
        const act = m.steps.findIndex((s) => s.phase === 'active');
        firstActiveStep[i] = act;
        if (m.type === 'normal') {
            if (!m.button)
                throw new Error(`normal ${m.id} missing button`);
            normals[STANCE_IDX[m.stance]][bitPos(BUTTON_BITS[m.button])] = i;
        }
        else if (m.type === 'special') {
            if (!m.motion || !m.buttons || m.buttons === 'PP')
                throw new Error(`special ${m.id} needs motion + P/K`);
            specials.push({ motion: m.motion, kind: m.buttons, idx: i });
        }
        else if (m.type === 'super') {
            if (!m.motion || m.buttons !== 'PP')
                throw new Error(`super ${m.id} needs motion + PP`);
            if (m.meterCost === undefined)
                throw new Error(`super ${m.id} missing meterCost`);
            superIdx = i;
        }
    });
    const cancelHit = new Uint8Array(n * n);
    const cancelBlock = new Uint8Array(n * n);
    for (const edge of b.cancels) {
        const from = moveIdxById[edge.from];
        if (from === undefined)
            throw new Error(`cancel edge from unknown move: ${edge.from}`);
        for (const toId of edge.to) {
            const to = moveIdxById[toId];
            if (to === undefined)
                throw new Error(`cancel edge to unknown move: ${toId}`);
            if (edge.on.includes('hit'))
                cancelHit[from * n + to] = 1;
            if (edge.on.includes('block'))
                cancelBlock[from * n + to] = 1;
        }
    }
    return { b, moveIdxById, normals, specials, superIdx, totalFrames, firstActiveStep, cancelHit, cancelBlock };
};

/**
 * Bump this on ANY change that alters simulated behaviour — including ai.ts.
 * Ranked solo (protocol v3) is a zero-latency LOCAL simulation: the client runs

 *            re-blessed); no drink pressed = still bit-identical to pre-item.

 *            constants; the sim clamps fighters to them and the server sends the
 *            stage's bounds in the match handshake. Default (no stage bounds) is
 *            the old full-width walls, so behavior is unchanged — but the
 *            serialize layout grew by 2 int32, so goldens were re-blessed.
 * af-core-7: Grab (throw startup) is strike-invulnerable (audit 2026-07-20
 *            CT-3). Fixes the "throw the fireballer" soft-lock: the victim's
 *            lingering projectile could knock the grabber to Hitstun, stranding
 *            the victim in Thrown with no resolver until the round timer (~99s,
 *            read as a freeze). No serialize-layout change and NO golden hash
 *            moved (no golden replay lands a projectile on a grabbing fighter),
 *            but the SIM behavior changed in that scenario, so client and server
 *            must pin the same engine — hence the version bump + paired deploy.
 */

/**
 * Motion input parsing. Each fighter keeps a ring buffer of numpad-notation
 * directions (facing-relative, 6 = toward opponent) in GameState. On every
 * attack-button press the parser scans the recent window for 623 / 236 / 214
 * — lenient, MvC style: the motion matches as a subsequence, diagonals
 * optional. All integer math over serialized state; fully deterministic.
 */
const HIST_LEN = 16; // ring buffer length (> motionWindowTicks)
/** Current direction as numpad notation, relative to facing (6 = forward). */
const numpadDir = (input, facing) => {
    const rawX = (held(input, 2 /* Btn.Right */) ? 1 : 0) - (held(input, 1 /* Btn.Left */) ? 1 : 0);
    const fx = rawX * facing; // +1 = toward opponent
    const base = held(input, 4 /* Btn.Up */) ? 8 : held(input, 8 /* Btn.Down */) ? 2 : 5;
    return base + fx;
};
/**
 * Does the last `window` entries of the ring buffer contain `pattern` as a
 * subsequence (oldest → newest)? Diagonal-tolerant variants are expressed by
 * passing alternate accepted dirs per slot (bitmask of numpad dirs 1-9).
 */
const matchesPattern = (hist, histIdx, window, pattern) => {
    let p = 0;
    for (let k = window - 1; k >= 0 && p < pattern.length; k--) {
        const dir = hist[(histIdx - k + HIST_LEN * 2) % HIST_LEN];
        if ((pattern[p] & (1 << dir)) !== 0)
            p++;
    }
    return p === pattern.length;
};
const D = (...dirs) => dirs.reduce((m, d) => m | (1 << d), 0);
// Lenient patterns (each slot is a set of accepted dirs):
// 623 (DP): forward, down(-ish), down-forward — classic f, d, df.
const PAT_623 = [D(6), D(2, 1), D(3)];
// 236 (QCF): down, forward — diagonal optional (2,3,6 or sloppy 2,6).
const PAT_236 = [D(2), D(3, 6)];
const PAT_236_STRICT_END = [D(2), D(6)];
// 214 (QCB): mirrored.
const PAT_214 = [D(2), D(1, 4)];
const PAT_214_STRICT_END = [D(2), D(4)];
/**
 * Detect the strongest motion ending at the current history position.
 * Priority: 623 > 236 > 214 (DP wins ambiguous overlaps, as in the genre).
 * Returns 623 | 236 | 214 | 0.
 */
const detectMotion = (hist, histIdx) => {
    const w = TUNING.motionWindowTicks;
    if (matchesPattern(hist, histIdx, w, PAT_623))
        return 623;
    if (matchesPattern(hist, histIdx, w, PAT_236) || matchesPattern(hist, histIdx, w, PAT_236_STRICT_END))
        return 236;
    if (matchesPattern(hist, histIdx, w, PAT_214) || matchesPattern(hist, histIdx, w, PAT_214_STRICT_END))
        return 214;
    return 0;
};
/** Was a down input seen recently (tap-down → up = super jump)? */
const downTappedRecently = (hist, histIdx) => {
    for (let k = 1; k <= TUNING.superJumpDownWindow; k++) {
        const dir = hist[(histIdx - k + HIST_LEN * 2) % HIST_LEN];
        if (dir >= 1 && dir <= 3)
            return true;
    }
    return false;
};

 * the camera's shift (drifts faster — nearer than the subject).
 *
 * TILING: rather than author oversized art or estimate exact camera travel,
 * each layer is tiled edge-to-edge using PING-PONG (mirror) tiling — every
 * other copy is horizontally flipped, so the touching edges are always the
 * same pixel column reflected onto itself. That makes the seam invisible
 * for ANY source image, with no special authoring and no visible repeat

const drawStageLayers = (ctx, stage, cam, vw, vh) => {

    }

    const viewH = vh / cam.zoom;

    const drawH = m.imageH * scale;

    // guards the same vertical-excursion edges the legacy path guarded.
    if (topY > T - 10) {
        ctx.fillStyle = m.skyColor;
        ctx.fillRect(L - 10, T - 10, viewW + 20, topY - (T - 10) + 1);
    }
    if (topY + drawH < B + 10) {
        ctx.fillStyle = m.deckColor;

    // but only when no layer is itself a stretched backdrop (`stretch:true`).
    // The Studio composes stages as a full-scene background.png + isolated
    // object planes (layer-mid/fg) and its preview draws the background first
    // (see studio main.ts `paint()`); without this the game ignored stage.image
    // whenever ANY layer existed, so those stages rendered as bare skyColor —
    // a black screen. Stages that DO carry a stretched layer-bg (rooftop,
    // school) already have their backdrop and are left untouched.
    if (stage.image && !stage.layers.some((l) => l.stretch)) {
        ctx.drawImage(stage.image, 0, topY, STAGE.widthPx, drawH);
    }
    for (const layer of stage.layers) {
        // Every plane draws its WHOLE source image (never cropped, so soft
        // edges/fades stay intact). Backdrops stretch to the shared bg-fit
        // `scale` (today's behavior). Object planes (a fence, a row of
        // buildings) use their own MANUALLY-SET scale/offsetY — set once in the
        // Studio, not derived from detected content (see StageLayerMeta.scale).
        const layerScale = layer.stretch ? scale : layer.scale;
        const tileW = layer.img.naturalWidth * layerScale;
        if (tileW < 1)
            continue;
        const layerH = layer.img.naturalHeight * layerScale;
        const layerTopY = layer.stretch ? topY : STAGE.floorYPx + layer.offsetY;
        // World-x of the k=0 tile's left edge. Derivation (see the function's
        // doc comment): worldX = nominal + (1-depth)*camX satisfies BOTH
        // boundary conditions — depth=1 gives a depth-independent constant
        // (matches drawStageImage's fixed world-x=0, today's pinned behavior),
        // depth=0 gives worldX=camX+nominal (screen-fixed, tracks the camera
        // exactly so the layer never appears to move — "infinitely far").
        // NO leading negation: `originX = -offsetX` here would double the
        // camera's own subtraction for near-zero depths instead of cancelling
        // it, making far layers drift FASTER than near ones — backwards.
        const nominal = layer.stretch ? 0 : layer.offsetX;
        const originX = nominal + (1 - layer.depth) * cam.x;
        const startK = Math.floor((L - originX) / tileW) - 1;
        const endK = Math.ceil((R - originX) / tileW) + 1;
        for (let k = startK; k <= endK; k++) {
            const x = originX + k * tileW;
            const mirrored = (((k % 2) + 2) % 2) === 1; // non-negative mod
            ctx.save();
            if (mirrored) {
                ctx.translate(x + tileW, layerTopY);
                ctx.scale(-1, 1);
                ctx.drawImage(layer.img, 0, 0, tileW, layerH);
            }
            else {
                ctx.drawImage(layer.img, x, layerTopY, tileW, layerH);
            }
            ctx.restore();
        }
    }
};

/**
 * Player progression: XP → level, persisted in localStorage (server profiles
 * arrive with M5/Privy — this is deliberately client-local until then).
 *
 * The CPU's strength follows the player's level, adjusted by a LEVER the
 * player controls (±). One mapping, one knob:
 *
 *   cpuLevel = clamp(playerLevel + lever, 1, MAX_LEVEL)
 *   aiSkill  = cpuLevel · 100 / MAX_LEVEL          (the core AI's 0-100 lever)
 */
const MAX_LEVEL = 40;
const KEY = 'af-profile';
const LEVER_KEY = 'af-cpu-lever';
const loadProfile = () => {
    try {
        const raw = localStorage.getItem(KEY);
        if (raw) {
            const p = JSON.parse(raw);
            if (typeof p.xp === 'number' && typeof p.level === 'number') {
                return { xp: p.xp, level: Math.max(1, p.level), wins: p.wins | 0, losses: p.losses | 0 };
            }
        }
    }
    catch { /* fresh profile */ }
    return { xp: 0, level: 1, wins: 0, losses: 0 };
};
const saveProfile = (p) => {
    try {
        localStorage.setItem(KEY, JSON.stringify(p));
    }
    catch { /* private mode */ }
};
/** XP needed to go from `level` to `level+1` — gentle early, steep later. */
const xpForNext = (level) => 80 + level * 45;
/** Award XP for a finished match. Returns levels gained (for the banner). */
const awardXp = (p, s) => {
    const gained = (s.won ? 60 : 20)
        + Math.min(60, Math.trunc(s.damageDealt / 250))
        + Math.min(40, s.bestCombo * 4);
    p.xp += gained;
    if (s.won)
        p.wins++;
    else
        p.losses++;
    let levelsUp = 0;
    while (p.level < MAX_LEVEL && p.xp >= xpForNext(p.level)) {
        p.xp -= xpForNext(p.level);
        p.level++;
        levelsUp++;
    }
    saveProfile(p);
    return { gained, levelsUp };
};
// ---- the lever -------------------------------------------------------------
const loadLever = () => {
    const v = Number(localStorage.getItem(LEVER_KEY) ?? '0');
    return Number.isFinite(v) ? Math.max(-10, Math.min(10, v)) : 0;
};
const saveLever = (v) => {
    try {
        localStorage.setItem(LEVER_KEY, String(v));
    }
    catch { /* ok */ }
};
const cpuLevelFor = (p, lever) => Math.max(1, Math.min(MAX_LEVEL, p.level + lever));
/** Map a CPU level onto the core AI's 0-100 skill lever. */
const skillForCpuLevel = (cpuLevel) => Math.max(3, Math.min(100, Math.round((cpuLevel * 100) / MAX_LEVEL)));

 * import target.

/**

const drawStage = (ctx, cam) => {

        drawStageLayers(ctx, stageAsset, cam, VW, VH);

        const bh = 90 + ((i * 53) % 120);

        if (x > R + 60 || x + bw < L - 60)
            continue;

    }
    // Near skyline + lit windows.
    for (let i = 0; i < 26; i++) {

    for (let wx = startX; wx < R + 20; wx += 14) {
        ctx.beginPath();
        ctx.moveTo(wx, fenceTop);
        ctx.lineTo(wx + 14, floorY);
        ctx.moveTo(wx + 14, fenceTop);
        ctx.lineTo(wx, floorY);
        ctx.stroke();

const drawCan = (ctx, x, y, w, h, color, glow = 0) => {
    ctx.save();
    if (glow > 0) {
        ctx.shadowColor = color;
        ctx.shadowBlur = glow;
    }
    ctx.fillStyle = '#1b1826';
    ctx.fillRect(x, y, w, h);
    // Slanted two-tone label (energy-drink trade-dress homage, original art):
    // silver upper-left / tier color lower-right, split on a diagonal.
    const ly = y + h * 0.14, lh = h * 0.72;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, ly, w, lh);
    ctx.clip();
    ctx.fillStyle = '#cdd6e2';
    ctx.fillRect(x, ly, w, lh);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(x, ly + lh);
    ctx.lineTo(x + w, ly + lh * 0.22);
    ctx.lineTo(x + w, ly + lh);
    ctx.closePath();
    ctx.fill();
    // Lightning bolt over the split (readable ≥18px wide; skip when tiny).
    if (w >= 18) {
        const bx = x + w * 0.5, byy = ly + lh * 0.18;
        ctx.fillStyle = '#1b1206';
        ctx.beginPath();
        ctx.moveTo(bx + w * 0.10, byy);
        ctx.lineTo(bx - w * 0.16, byy + lh * 0.38);
        ctx.lineTo(bx - w * 0.02, byy + lh * 0.38);
        ctx.lineTo(bx - w * 0.12, byy + lh * 0.66);
        ctx.lineTo(bx + w * 0.18, byy + lh * 0.28);
        ctx.lineTo(bx + w * 0.02, byy + lh * 0.28);
        ctx.closePath();
        ctx.fill();
    }
    ctx.restore();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#e8eef5';
    ctx.fillRect(x, y, w, h * 0.1); // lid
    ctx.fillRect(x, y + h * 0.92, w, h * 0.08); // base
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(x + w * 0.16, y + h * 0.12, w * 0.14, h * 0.76); // shine
    ctx.fillStyle = '#0a0812';
    ctx.fillRect(x + w * 0.4, y + h * 0.02, w * 0.24, h * 0.05); // tab
    ctx.restore();
};

    ctx.arcTo(x + w, y + h, x, y + h, rr);

    label(ctx, stat.label, x, y + 9, 10, '#d3cfe0', 'left', false);
    const trackX = x + 80, trackW = w - 80;
    const n = 5, sgap = 3, bh = 11, rad = 3;
    const segW = (trackW - (n - 1) * sgap) / n;
    const lightC = tintHex(accent, 75), darkC = tintHex(accent, -55);

            grad.addColorStop(0.5, accent);
            grad.addColorStop(1, darkC);

            ctx.shadowBlur = 6;
            ctx.fillStyle = grad;

/**
 * Pre-fight stakes card (P0): 2½ seconds of "this is what's on the line" —
 * fighters, names, and the exact credit/XP terms. Doubles as the fight's
 * establishing beat (the 'vs' stinger plays under it). Pure overlay: the
 * caller decides whether the sim runs beneath it.
 *
 * All FX are procedural (no assets): the menu background video, a diagonal
 * red/blue split, converging speed lines, an impact burst behind the VS mark,
 * drifting embers, scanlines and a vignette. Cheap by construction — a few
 * dozen strokes per frame, no per-pixel work.

const drawVsCard = (ctx, rosters, names, stakes, // 1-3 short lines, most important first

levels) => {
    const inT = easeOutBack(clamp01(age / 14));
    const wipe = clamp01(age / 18);
    // ---- backdrop: the menu video, heavily darkened so fighters/text pop.
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, VW, VH);
    ctx.clip();
    if (!(bgVideo && drawBgVideoCover(ctx, bgVideo, 0, 0, VW, VH))) {
        ctx.fillStyle = '#0a0616';
        ctx.fillRect(0, 0, VW, VH);
    }
    ctx.restore();
    ctx.fillStyle = `rgba(6,4,12,${0.72 * clamp01(age / 6)})`;
    ctx.fillRect(0, 0, VW, VH);
    // ---- diagonal split: red side / blue side, wiping in from the seam.
    const seamTop = VW * 0.545, seamBot = VW * 0.455;
    const seamX = (t) => seamTop + (seamBot - seamTop) * t; // t: 0 top → 1 bottom
    ctx.save();
    ctx.globalAlpha = 0.5 * wipe;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(seamTop, 0);
    ctx.lineTo(seamBot, VH);
    ctx.lineTo(0, VH);
    ctx.closePath();
    const gl = ctx.createLinearGradient(0, 0, seamTop, VH);
    gl.addColorStop(0, '#00000000');
    gl.addColorStop(1, '#8f1f2e88');
    ctx.fillStyle = gl;
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(seamTop, 0);
    ctx.lineTo(VW, 0);
    ctx.lineTo(VW, VH);
    ctx.lineTo(seamBot, VH);
    ctx.closePath();
    const gr = ctx.createLinearGradient(VW, 0, seamBot, VH);
    gr.addColorStop(0, '#00000000');
    gr.addColorStop(1, '#1f4f8f88');
    ctx.fillStyle = gr;
    ctx.fill();
    ctx.restore();
    // ---- converging speed lines (each side rakes toward the seam).
    ctx.save();
    ctx.globalAlpha = 0.22 * wipe;
    ctx.lineWidth = 2;
    for (let i = 0; i < 26; i++) {
        const side = i % 2;
        const t = hash01(i, 1);
        const y = t * VH;
        const len = 60 + hash01(i, 2) * 190;
        const drift = ((age * 3 + hash01(i, 3) * 400) % 460) - 60;
        const x0 = side === 0 ? drift : VW - drift;
        ctx.strokeStyle = side === 0 ? '#ff8a9a' : '#8ac6ff';
        ctx.beginPath();
        ctx.moveTo(x0, y);
        ctx.lineTo(x0 + (side === 0 ? len : -len), y);
        ctx.stroke();
    }
    ctx.restore();
    // ---- fighters (behind the seam flash + text).
    const slide = (1 - inT) * 210;
    drawVsFighter(ctx, rosters[0], 0, slide, age);
    drawVsFighter(ctx, rosters[1], 1, slide, age);
    // ---- the seam itself: a bright energy slash with a travelling glint.
    ctx.save();
    ctx.globalAlpha = wipe;
    const seamGrad = ctx.createLinearGradient(seamTop, 0, seamBot, VH);
    seamGrad.addColorStop(0, 'rgba(255,209,102,0)');
    seamGrad.addColorStop(0.5, 'rgba(255,240,200,0.85)');
    seamGrad.addColorStop(1, 'rgba(255,209,102,0)');
    ctx.strokeStyle = seamGrad;
    ctx.lineWidth = 3;
    ctx.shadowColor = 'rgba(255,209,102,0.9)';
    ctx.shadowBlur = 18;
    ctx.beginPath();
    ctx.moveTo(seamTop, -10);
    ctx.lineTo(seamBot, VH + 10);
    ctx.stroke();
    // Glint sliding down the slash.
    const gt = ((age % 90) / 90);
    ctx.globalAlpha = wipe * (1 - Math.abs(gt - 0.5) * 2) * 0.9;
    ctx.fillStyle = '#fffbe8';
    ctx.beginPath();
    ctx.arc(seamX(gt), gt * VH, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    // ---- embers drifting up the frame (stable per-index layout).
    ctx.save();
    for (let i = 0; i < 20; i++) {
        const speed = 0.35 + hash01(i, 4) * 0.5;
        const ey = (VH + 40 - ((age * speed + hash01(i, 5) * VH) % (VH + 80)));
        const ex = hash01(i, 6) * VW + Math.sin((age / 30) + i) * 8;
        const r = 1 + hash01(i, 7) * 2;
        ctx.globalAlpha = 0.5 * wipe * (0.4 + hash01(i, 8) * 0.6);
        ctx.fillStyle = ex < seamX(ey / VH) ? '#ffb08a' : '#8ac6ff';

        ctx.fillRect(0, 0, VW, VH);
    }
    // ---- VS mark: slams in, then breathes.
    const breathe = 1 + 0.02 * Math.sin(age / 12);
    ctx.save();
    ctx.translate(VW / 2, 152);
    ctx.scale(inT * breathe, inT * breathe);
    ctx.translate(-VW / 2, -152);
    display(ctx, 'VS', VW / 2, 168, 96, { glow: 'rgba(255,209,102,0.75)' });
    ctx.restore();
    // ---- terms band: a dark scrim keeps the stakes readable over the art.
    if (stakes.length > 0 && age > 8) {
        const bandA = clamp01((age - 8) / 12);
        const bandY = 208, bandH = 24 + stakes.length * 24;
        ctx.save();
        ctx.globalAlpha = bandA;
        const bg = ctx.createLinearGradient(0, bandY, 0, bandY + bandH);
        bg.addColorStop(0, 'rgba(10,7,20,0.0)');
        bg.addColorStop(0.15, 'rgba(10,7,20,0.85)');
        bg.addColorStop(0.85, 'rgba(10,7,20,0.85)');
        bg.addColorStop(1, 'rgba(10,7,20,0.0)');
        ctx.fillStyle = bg;
        ctx.fillRect(0, bandY, VW, bandH);
        // Gold hairlines top and bottom, drawn from the center out.
        const lineW = VW * bandA;
        ctx.fillStyle = 'rgba(255,209,102,0.55)';
        ctx.fillRect(VW / 2 - lineW / 2, bandY + 6, lineW, 1);
        ctx.fillRect(VW / 2 - lineW / 2, bandY + bandH - 6, lineW, 1);
        stakes.forEach((s, k) => {
            label(ctx, s, VW / 2, bandY + 30 + k * 24, k === 0 ? 17 : 13, k === 0 ? GOLD_LT : '#ffffffaa');
        });
        ctx.restore();
    }
    // ---- nameplates under each fighter.
    [0, 1].forEach((i) => {
        const nx = VS_CX[i] + (i === 0 ? -slide : slide);
        ctx.save();
        ctx.globalAlpha = inT;
        label(ctx, names[i].toUpperCase().slice(0, 20), nx, VH - 26, 16, i === 0 ? '#8fe8a0' : '#ff9d9d');
        // LV chip: the matchup stat that frames the fight (higher = expected win).
        const lv = levels?.[i];
        if (lv != null) {
            const txt = `LV ${lv}`;
            ctx.font = '700 12px ' + DISPLAY_FONT_STACK;
            const cw = ctx.measureText(txt).width + 16;
            const cy = VH - 12, chH = 15;
            bevel(ctx, nx - cw / 2, cy - chH + 3, cw, chH, '#1a1526e0', GOLD, GOLD_DK, 1);
            label(ctx, txt, nx, cy - 1, 11, GOLD_LT);
        }
        ctx.restore();
    });
    // ---- scanlines + vignette: cheap CRT-ish polish.
    ctx.save();
    ctx.globalAlpha = 0.06;
    ctx.fillStyle = '#000';
    for (let y = 0; y < VH; y += 3)
        ctx.fillRect(0, y, VW, 1);
    ctx.restore();
    const vig = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.35, VW / 2, VH / 2, VH * 0.85);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,0.65)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, VW, VH);
    if (age > 40 && age % 50 < 36) {
        label(ctx, 'ANY KEY — FIGHT', VW / 2, VH - 8, 12, '#ffffff77');
    }
};

// ---- client/src/autospecial.js ----
/**
 * Auto Special Attack — tap the logo badge, get a special.
 *
 * THE RULE THAT SHAPES ALL OF THIS: matches are re-simulated by the match
 * server from the input log to verify the result, and a client whose inputs
 * don't reproduce its claimed outcome forfeits (ADR 0003 — see the server's
 * "deviator forfeits the pot" test). So this feature may NOT poke the sim,
 * start a move, or touch meter. It synthesises exactly the buttons a human
 * would press — down, down-forward, forward, punch — and feeds them through
 * the normal InputFrame path. The server then sees an ordinary input stream
 * and agrees with us.
 *
 * That constraint is a gift: this is a pure client feature. @af/core is
 * untouched, and it works under rollback/online for free.
 *
 * The scripts mirror `ai.ts` (qFireball/qDp), which already drives motions
 * this way for CPU opponents — same mechanism, same parser, proven.
 *

 * decision, not sim state: the sim never sees our RNG, only the buttons.
 */

let queue = [];
let ticksLeft = 0;

const autoSpecialActive = () => queue.length > 0;
/** Drop any running macro (round reset, leaving the match, got hit). */
const cancelAutoSpecial = () => { queue = []; ticksLeft = 0; };

const autoSpecialCharged = (f) => f.meter >= TUNING.meterBar;

const isActionable = (f) => f.action === 0 /* Action.Idle */ || f.action === 1 /* Action.WalkF */

const gapPx = (a, b) => Math.abs(fpToPx(a.x - b.x));

// Each is a few ticks of directions then the button, sized so the pattern
// lands inside TUNING.motionWindowTicks (14) when the press is buffered.
const s236 = (buttons) => [
    { down: 1, ticks: 3 },
    { down: 1, fwd: 1, ticks: 2 },
    { fwd: 1, ticks: 2 },
    { fwd: 1, buttons, ticks: 2 },
    { ticks: 1 },
];
const s623 = (buttons) => [
    { fwd: 1, ticks: 2 },
    { down: 1, ticks: 2 },
    { down: 1, fwd: 1, buttons, ticks: 3 },
    { ticks: 1 },
];
const s214 = (buttons) => [
    { down: 1, ticks: 3 },
    { down: 1, back: 1, ticks: 2 },
    { back: 1, ticks: 2 },
    { back: 1, buttons, ticks: 2 },
    { ticks: 1 },
];
const scriptFor = (motion, buttons) => (motion === 623 ? s623 : motion === 214 ? s214 : s236)(buttons);
/**
 * Score the character's real special list against the current situation, so a

 * hands the opponent a free punish. Still random among the plausible picks —
 * one tap should feel lucky, not like an aimbot.
 */
const optionsFor = (g, side, ch) => {
    const me = g.fighters[side];
    const op = g.fighters[side === 0 ? 1 : 0];
    const d = gapPx(me, op);
    const oppAir = !isGrounded(op);
    const out = [];
    for (const sp of ch.specials) {
        const move = ch.b.moves[sp.idx];
        if (move.stance === 'air')
            continue; // ground-only tap
        const buttons = sp.kind === 'P' ? 16 /* Btn.LP */ : 128 /* Btn.LK */;
        let weight = 1;
        if (sp.motion === 623)
            weight = oppAir && d < 240 ? 10 : d < 90 ? 3 : 1; // anti-air / reversal
        else if (sp.motion === 236)
            weight = d > 260 ? 8 : d > 140 ? 4 : 2; // zoning
        else if (sp.motion === 214)
            weight = d < 200 ? 5 : 1; // close range
        out.push({ motion: sp.motion, buttons, weight, label: move.id });
    }
    // The super joins the pool only when it's actually affordable — the same
    // condition that turns the badge red, so the glow never lies.
    if (ch.superIdx >= 0) {
        const sup = ch.b.moves[ch.superIdx];
        const cost = sup.meterCost ?? 0;
        if (me.meter >= cost && sup.motion) {
            // Two punches is what the sim requires for a super (countBits >= 2).
            out.push({
                motion: sup.motion,
                buttons: 16 /* Btn.LP */ | 32 /* Btn.MP */,
                weight: !oppAir && d < 320 ? 9 : 3,
                label: sup.id,
            });
        }
    }
    return out;
};
/** Can a tap start right now? Ground-only, and only from a neutral state. */
const canAutoSpecial = (g, side, ch) => {
    if (queue.length > 0)
        return false; // already running — ignore mashing
    const me = g.fighters[side];
    return isGrounded(me) && isActionable(me) && optionsFor(g, side, ch).length > 0;
};
/**
 * Begin a macro. `rand01` is injected (Math.random by default) purely so tests
 * can pin the pick — it never reaches the sim.
 * Returns the chosen move id, or null if the tap was refused.
 */
const startAutoSpecial = (g, side, ch, rand01 = Math.random) => {
    if (!canAutoSpecial(g, side, ch))
        return null;
    const opts = optionsFor(g, side, ch);
    const total = opts.reduce((t, o) => t + o.weight, 0);
    let roll = rand01() * total;
    let pick = opts[opts.length - 1];
    for (const o of opts) {
        roll -= o.weight;
        if (roll <= 0) {
            pick = o;
            break;
        }
    }
    queue = scriptFor(pick.motion, pick.buttons);
    ticksLeft = queue[0].ticks;
    return pick.label;
};
/**
 * Produce this tick's input and advance the script. Call INSTEAD of the human
 * pad poll while active — the two must never merge, or the player's own stick
 * corrupts the motion mid-macro.
 */
const pollAutoSpecial = (me) => {
    // Interrupted (hit, knocked down): abandon the motion rather than finishing
    // it late into something the player never asked for.
    if (me.hitstunLeft > 0 || me.action === 10 /* Action.Hitstun */
        || me.action === 11 /* Action.AirHitstun */ || me.action === 15 /* Action.Knockdown */) {
        cancelAutoSpecial();
        return 0;
    }
    const step = queue[0];
    if (!step)
        return 0;
    let f = 0;
    const fwdBit = me.facing === 1 ? 2 /* Btn.Right */ : 1 /* Btn.Left */;
    const backBit = me.facing === 1 ? 1 /* Btn.Left */ : 2 /* Btn.Right */;
    if (step.fwd)
        f |= fwdBit;
    if (step.back)
        f |= backBit;
    if (step.up)
        f |= 4 /* Btn.Up */;
    if (step.down)
        f |= 8 /* Btn.Down */;
    if (step.buttons)
        f |= step.buttons;
    if (--ticksLeft <= 0) {
        queue.shift();
        ticksLeft = queue[0]?.ticks ?? 0;
    }
    return f;
};

                net = null;

                screen = 'invite';

                net = null;

                    arcade.stage++;
                    startArcadeFight();

                    const token = arcade.runToken;
                    net?.close();
                    net = null;
                    startOnline('arcade', token);

                // A dare-vs-agent solo rematches the SAME trained agent (run it back).
                const again = queuedMode;
                const againAgent = queuedAgentOf || undefined;

            ctx.textAlign = 'center';

            }

            // OAuth dialog fires in-gesture from the pointerdown handler above.
            const bw = 380, bh = 42, bx = VW / 2 - bw / 2, by = VH - 100;

            ctx.fillRect(bx, by, bw, bh);

            ctx.lineWidth = 2;
            ctx.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
            ctx.textAlign = 'center';
            ctx.font = 'bold 15px "Courier New", monospace';
            ctx.fillStyle = '#ffd166';
            ctx.fillText('◆ SIGN IN TO PLAY MORE', VW / 2, by + 19);
            ctx.font = '11px "Courier New", monospace';
            ctx.fillStyle = '#ffffffaa';
            ctx.fillText('bank credits & XP · unlock ranked · +10 free daily', VW / 2, by + 34);
            ctx.restore();

    // ended on, so it appears/disappears in lockstep with what was just drawn.
    setTouchScreen(screen);

    // running — on a memory-tight phone that headroom matters (iOS jetsam guard,
    // same fix family as the audio-cache eviction). Pause in-fight, resume on
    // menus. Edge-triggered; play() is a promise that can reject on iOS, hence
    // the silent catch (a paused backdrop just falls back to the static stage).
    const wantVideo = screen !== 'fight';
    if (bgVideoRef && wantVideo !== bgVideoPlaying) {

};
// ---------------------------------------------------------------- loop
let last = performance.now();
let acc = 0;
// Perf overlay (F): live FPS (rAF cadence), frame cost (sim+render ms), and
// the netcode stall counter — the triage tool for "the game feels slow":
// low FPS = this machine/browser; high ms/f = our renderer; stalls = network.
let perfShow = false;
let perfFps = 60;
let perfMs = 0;
// F toggles perf — except on MY AGENT, where F = CREATE AGENT FIGHTER.
addEventListener('keydown', (e) => {
    if (e.code === 'KeyF' && screen !== 'agent')
        perfShow = !perfShow;
});
// Touch path to the same overlay (no keyboard on mobile): 3 quick taps in
// the top-right corner of the canvas. Passive observer — game input never
// routes through this, and the corner is dead HUD space during fights.
let perfTaps = 0;
let perfTapAt = 0;
ctx.canvas.addEventListener('pointerdown', (e) => {
    const r = ctx.canvas.getBoundingClientRect();
    if (r.width === 0 || e.clientX - r.left < r.width * 0.85 || e.clientY - r.top > r.height * 0.15)
        return;
    const now = performance.now();
    perfTaps = now - perfTapAt < 600 ? perfTaps + 1 : 1;
    perfTapAt = now;
    if (perfTaps >= 3) {

        perfTaps = 0;
    }
});
const drawPerf = () => {

    // ping = RTT to the relay (netplay only; solo sims locally and shows —).
    // rb last/max = rollback re-sim depth — how hard prediction is working.
    const netTxt = net
        ? `  ·  ping ${net.rtt < 0 ? '—' : `${Math.round(net.rtt)}ms`}  ·  rb ${net.lastRollback}/${net.maxRollback}  ·  stall ${stalled}`
        : '';
    const txt = `${perfFps.toFixed(0)} FPS  ·  ${perfMs.toFixed(1)} ms/f${netTxt}`;
    ctx.save();
    ctx.font = 'bold 11px "Courier New", monospace';
    ctx.textAlign = 'right';
    const w = ctx.measureText(txt).width + 14;
    ctx.fillStyle = '#000000aa';
    ctx.fillRect(VW - w - 6, VH - 40, w, 18);
    ctx.fillStyle = perfFps > 55 ? '#7ee85a' : perfFps > 40 ? '#ffd166' : '#ff6b6b';
    ctx.fillText(txt, VW - 13, VH - 27);
    ctx.restore();
};
const loop = (now) => {
    const rafDt = now - last;
    acc = Math.min(acc + rafDt, 200); // tab-switch guard
    last = now;
    perfFps += ((1000 / Math.max(1, rafDt)) - perfFps) * 0.05; // EMA
    const t0 = performance.now();
    try {
        // Count the fixed-timestep ticks owed this rAF, then advance + render ONCE
        // (frame loops the sim internally). Rendering once per SIM TICK — up to 12
        // per rAF at the 200ms cap — was the CT-2 catch-up spiral (audit 2026-07-20).
        let steps = 0;
        while (acc >= TICK_MS) {
            acc -= TICK_MS;
            steps++;
        }
        if (steps > 0) {
            frame(steps);
            perfMs += (performance.now() - t0 - perfMs) * 0.1; // EMA
        }

            frame(1); // keep the loading screen painted while nothing else advances
        }

            drawPerf();

    catch (err) {
        acc = 0; // don't re-enter a throwing frame repeatedly within one catch-up burst
        reportClientError('loop', err);
    }
    // ALWAYS re-arm the loop. A single thrown exception must never skip this and
    // freeze the game permanently (audit 2026-07-20 CT-1); a transient throw
    // self-heals on the next frame instead of killing the canvas.
    requestAnimationFrame(loop);

void boot();
requestAnimationFrame(loop);
/**
 * Console/automation hooks. `afStep(n)` advances exactly n frames without
 * rAF — the hook automated visual tests and headless screenshots drive
 * (browsers throttle rAF to zero in hidden tabs). Replay export lands here
 * later; the input log is already the full match record.
 */
Object.assign(globalThis, {
    afGame: () => game,
    afRosters: () => allRosters,
    afScreen: () => screen,
    afCam: () => ({ ...cam }),
    afStep: (n = 1) => { for (let k = 0; k < n; k++)
        frame(); },
    afPress: (code) => { pressedThisFrame.add(code); keys.add(code); },
    afRelease: (code) => { keys.delete(code); },
    afMode: (m) => { if (m)
        mode = m; return mode; },
    afProfile: () => ({ ...profile, lever }),
    afAccount: () => (account ? { ...account, fetch: accountFetch } : { fetch: accountFetch }),
    afSetLever: (v) => { lever = Math.max(-10, Math.min(10, v | 0)); saveLever(lever); },
    afNet: () => (net ? {

        stalled: net.stalled, side: net.side, oppGoneUntil: net.oppGoneUntil,
        rtt: net.rtt, rollback: net.lastRollback, maxRollback: net.maxRollback, stallTotal: net.stallTotal,
        auto: net instanceof SoloSession ? net.auto : false,
        coached: !!agentCfg,

    // Sever the live socket WITHOUT the leave-intent flag — simulates a wifi

// Actions that open an OS / OAuth surface (share sheet, clipboard, the AIR

canvas.addEventListener('pointerdown', () => {

    // iPhone if this dialog can't open. (Guard on the audio dropdown so a tap
    // meant to dismiss it isn't hijacked into a login — mirrors the frame loop's
    // branch order.)
    if (screen === 'title' && !audioMenuOpen && taps.has('signin')) {
        toggleSignIn();
        taps.delete('signin');
        return;
    }
    // GUEST account-gated title actions (RANKED wager row, shop, my agent, dare)
    // open the AIR OAuth dialog — same iOS user-activation rule as the gate
    // button, so fire it in-gesture and drop the taps. AGENT ARCADE (mode:cpu),
    // rankings, and change-fighter are NOT here: guests reach those freely.
    if (screen === 'title' && !audioMenuOpen && !isSignedIn()
        && (taps.has('mode:online') || taps.has('shop') || taps.has('myagent') || taps.has('dare'))) {
        void authLogin();
        taps.delete('mode:online');
        taps.delete('shop');
        taps.delete('myagent');
        taps.delete('dare');
        return;
    }
    // GAME OVER (guest arcade loss): the "SIGN IN TO PLAY MORE" CTA is the same
    // in-gesture OAuth surface. Any OTHER tap dismisses to the title (frame loop).
    if (screen === 'gameover' && taps.has('signin')) {
        toggleSignIn();
        taps.delete('signin');
        return;
    }

    // same iOS user-activation rule as the share sheet (see block comment).
    if (screen === 'agent' && taps.has('agent:copykey') && mintedKey) {
        void navigator.clipboard?.writeText(mintedKey)
            .then(() => { keyCopiedAge = 0; })
            .catch(() => { window.prompt('COPY YOUR COACH KEY:', mintedKey); keyCopiedAge = 0; });
        taps.delete('agent:copykey');
        return;
    }
    if (screen !== 'invite')
        return;
    if (taps.has('copydare')) {
        shareDare();
        taps.delete('copydare'); // frame handler must not fire a second share
    }

        const code = account.refCode;
        void navigator.clipboard
            ?.writeText(`${location.origin}/?room=${encodeURIComponent(code)}&ref=${encodeURIComponent(code)}`)
            .catch(() => { });
        startFriendly(code);
        taps.delete('challenge');
    }
});
// Mobile: auto-detect touch devices and lay the on-screen controls over the
// canvas; register the PWA + offer install on the first landing. Both are
// no-ops on desktop / when already installed. Runs after afScreen (above) is
// exposed so the overlay can sync its visibility to the current game screen.
initPwa();
initTouchControls();
</script>
