/**
 * Fixed-point math. All sim positions/velocities are integers in 1/256 px
 * ("subpixels", 24.8 fixed point). Determinism rule: the sim NEVER stores or
 * computes with floats. JS doubles represent integers exactly up to 2^53,
 * and all our products stay far below that, so integer math here is
 * bit-identical across engines/platforms.
 */
const FP = 256;
/** Convert whole pixels to fixed-point. */
const fp = (px) => Math.trunc(px * FP);
/** Fixed-point multiply: (a * b) / FP, truncated toward zero. */
const fpMul = (a, b) => Math.trunc((a * b) / FP);
/** Truncate toward zero to pixels (for rendering / hitbox rects only). */
const fpToPx = (v) => Math.trunc(v / FP);
/** Clamp integer value. */
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
/**
 * Deterministic PRNG (mulberry32-style, integer-only variant).
 * Lives inside GameState; never use Math.random in the sim.
 */
const nextRand = (seed) => {
    let t = (seed + 0x6d2b79f5) | 0;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t = (t + Math.imul(t ^ (t >>> 7), t | 61)) | 0;
    return (t ^ (t >>> 14)) >>> 0;
};

// ---- core/src/input.js ----
const PUNCH_MASK = 16 /* Btn.LP */ | 32 /* Btn.MP */ | 64 /* Btn.HP */;
const KICK_MASK = 128 /* Btn.LK */ | 256 /* Btn.MK */ | 512 /* Btn.HK */;
const ATTACK_MASK = PUNCH_MASK | KICK_MASK;
const DIR_MASK = 1 /* Btn.Left */ | 2 /* Btn.Right */ | 4 /* Btn.Up */ | 8 /* Btn.Down */;
const held = (f, b) => (f & b) !== 0;
/** Rising edge: pressed this frame, not held last frame. */
const pressed = (now, prev, b) => (now & b) !== 0 && (prev & b) === 0;
/** All attack buttons newly pressed this frame, as a mask. */
const pressedAttacks = (now, prev) => now & ~prev & ATTACK_MASK;
/** Popcount for small masks (attack buttons). Deterministic integer loop. */
const countBits = (v) => {
    let n = 0;
    while (v !== 0) {
        n += v & 1;
        v >>>= 1;
    }
    return n;
};

// ---------------------------------------------------------------------------

const BUTTON_BITS = {
    LP: 16 /* Btn.LP */, MP: 32 /* Btn.MP */, HP: 64 /* Btn.HP */, LK: 128 /* Btn.LK */, MK: 256 /* Btn.MK */, HK: 512 /* Btn.HK */,
};
/** Resolution priority when several buttons are pressed the same frame. */
const BUTTON_PRIORITY = ['HP', 'HK', 'MP', 'MK', 'LP', 'LK'];
const STANCE_IDX = { stand: 0, crouch: 1, air: 2 };
const bitPos = (bit) => {
    let p = 0;
    while ((bit >>= 1) !== 0)
        p++;
    return p;
};
/** Validate + index a character bundle. Throws on malformed data. */
const loadCharacter = (b) => {
    const n = b.moves.length;
    const moveIdxById = {};
    b.moves.forEach((m, i) => {
        if (moveIdxById[m.id] !== undefined)
            throw new Error(`duplicate move id: ${m.id}`);
        if (m.steps.length === 0)
            throw new Error(`move ${m.id} has no steps`);
        for (const st of m.steps) {
            if (!Number.isInteger(st.frames) || st.frames <= 0) {
                throw new Error(`move ${m.id}: step frames must be positive integers`);
            }
        }
        moveIdxById[m.id] = i;
    });
    const normals = [new Int32Array(10).fill(-1), new Int32Array(10).fill(-1), new Int32Array(10).fill(-1)];
    const specials = [];
    let superIdx = -1;
    const totalFrames = new Int32Array(n);
    const firstActiveStep = new Int32Array(n).fill(-1);
    b.moves.forEach((m, i) => {
        totalFrames[i] = m.steps.reduce((acc, s) => acc + s.frames, 0);
        const act = m.steps.findIndex((s) => s.phase === 'active');
        firstActiveStep[i] = act;
        if (m.type === 'normal') {
            if (!m.button)
                throw new Error(`normal ${m.id} missing button`);
            normals[STANCE_IDX[m.stance]][bitPos(BUTTON_BITS[m.button])] = i;
        }
        else if (m.type === 'special') {
            if (!m.motion || !m.buttons || m.buttons === 'PP')
                throw new Error(`special ${m.id} needs motion + P/K`);
            specials.push({ motion: m.motion, kind: m.buttons, idx: i });
        }
        else if (m.type === 'super') {
            if (!m.motion || m.buttons !== 'PP')
                throw new Error(`super ${m.id} needs motion + PP`);
            if (m.meterCost === undefined)
                throw new Error(`super ${m.id} missing meterCost`);
            superIdx = i;
        }
    });
    const cancelHit = new Uint8Array(n * n);
    const cancelBlock = new Uint8Array(n * n);
    for (const edge of b.cancels) {
        const from = moveIdxById[edge.from];
        if (from === undefined)
            throw new Error(`cancel edge from unknown move: ${edge.from}`);
        for (const toId of edge.to) {
            const to = moveIdxById[toId];
            if (to === undefined)
                throw new Error(`cancel edge to unknown move: ${toId}`);
            if (edge.on.includes('hit'))
                cancelHit[from * n + to] = 1;
            if (edge.on.includes('block'))
                cancelBlock[from * n + to] = 1;
        }
    }
    return { b, moveIdxById, normals, specials, superIdx, totalFrames, firstActiveStep, cancelHit, cancelBlock };
};

// ---- core/src/motion.js ----
/**
 * Motion input parsing. Each fighter keeps a ring buffer of numpad-notation
 * directions (facing-relative, 6 = toward opponent) in GameState. On every
 * attack-button press the parser scans the recent window for 623 / 236 / 214
 * — lenient, MvC style: the motion matches as a subsequence, diagonals
 * optional. All integer math over serialized state; fully deterministic.
 */
const HIST_LEN = 16; // ring buffer length (> motionWindowTicks)
/** Current direction as numpad notation, relative to facing (6 = forward). */
const numpadDir = (input, facing) => {
    const rawX = (held(input, 2 /* Btn.Right */) ? 1 : 0) - (held(input, 1 /* Btn.Left */) ? 1 : 0);
    const fx = rawX * facing; // +1 = toward opponent
    const base = held(input, 4 /* Btn.Up */) ? 8 : held(input, 8 /* Btn.Down */) ? 2 : 5;
    return base + fx;
};
/**

        if (frame < acc)
            return s.sprite ?? null;
    }
    return move.steps[move.steps.length - 1]?.sprite ?? null;
};
/** Looping animation: counter wraps over the move's total frames. */
const loopSprite = (ch, id, counter) => {
    const idx = ch.moveIdxById[id];
    if (idx === undefined)
        return null;
    const total = ch.totalFrames[idx];
    return stepSpriteAt(ch, idx, total > 0 ? counter % total : 0);
};
/** One-shot animation: clamps to the last step. */
const onceSprite = (ch, id, counter) => {
    const idx = ch.moveIdxById[id];
    if (idx === undefined)
        return null;
    return stepSpriteAt(ch, idx, Math.min(counter, ch.totalFrames[idx] - 1));
};
/** Fixed step of a multi-step system move (e.g. jump rise/apex/fall). */
const stepOf = (ch, id, step) => {
    const idx = ch.moveIdxById[id];
    if (idx === undefined)
        return null;
    const move = ch.b.moves[idx];
    const s = move.steps[Math.min(step, move.steps.length - 1)];
    return s?.sprite ?? null;
};
const VEL_EPS = fp(2);
/**
 * Resolve the sprite for a fighter's current state, or null (render fallback).
 * `tick` drives loops for states whose actionFrame does not advance.
 */
const spriteForFighter = (f, ch, tick) => {
    const airFrame = () => f.velY < -VEL_EPS ? stepOf(ch, SYS.jump, 0)
        : f.velY <= VEL_EPS ? stepOf(ch, SYS.jump, 1)
            : stepOf(ch, SYS.jump, 2);
    switch (f.action) {
        case 9 /* Action.Attack */:
            return f.moveIdx >= 0 ? stepSpriteAt(ch, f.moveIdx, f.actionFrame) : null;
        case 0 /* Action.Idle */:
            return loopSprite(ch, SYS.idle, f.actionFrame);
        case 1 /* Action.WalkF */:
            return loopSprite(ch, SYS.walkF, f.actionFrame);
        case 2 /* Action.WalkB */:
            return loopSprite(ch, SYS.walkB, f.actionFrame);
        case 3 /* Action.Crouch */:
            return loopSprite(ch, SYS.crouch, f.actionFrame);
        case 4 /* Action.JumpSquat */:
            return stepOf(ch, SYS.crouch, 0);
        case 5 /* Action.Air */:
            return airFrame();
        case 8 /* Action.AirDash */:
            return stepOf(ch, SYS.dashF, 0) ?? airFrame();
        case 6 /* Action.DashF */:
            return stepOf(ch, SYS.dashF, 0);
        case 7 /* Action.DashB */:
            return stepOf(ch, SYS.dashB, 0);
        case 12 /* Action.BlockStand */:
            return stepOf(ch, SYS.block, 0);
        case 13 /* Action.BlockCrouch */:
            return stepOf(ch, SYS.blockCrouch, 0);
        case 14 /* Action.BlockAir */:
            return stepOf(ch, SYS.blockAir, 0);
        case 10 /* Action.Hitstun */:
        case 18 /* Action.Thrown */:
            return stepOf(ch, SYS.hitstun, 0);
        case 11 /* Action.AirHitstun */:
            return stepOf(ch, SYS.airHitstun, 0);
        case 15 /* Action.Knockdown */:
            return stepOf(ch, SYS.knockdown, 0);
        case 16 /* Action.Getup */:
            return onceSprite(ch, SYS.getup, f.actionFrame);
        case 17 /* Action.Grab */:
            return stepOf(ch, SYS.idle, 0);
        case 19 /* Action.KO */:
            return f.velY !== 0 ? stepOf(ch, SYS.airHitstun, 0)
                : stepOf(ch, SYS.ko, 0) ?? stepOf(ch, SYS.knockdown, 0);
        default:
            return loopSprite(ch, SYS.idle, tick);
    }
};

// ---- client/src/atlas.js ----
/** Tight alpha bounds of an image (computed once at load). */
const alphaBounds = (img) => {
    const c = document.createElement('canvas');
    c.width = img.naturalWidth;
    c.height = img.naturalHeight;
    const cx = c.getContext('2d', { willReadFrequently: true });
    if (!cx)
        return null;
    cx.drawImage(img, 0, 0);
    const d = cx.getImageData(0, 0, c.width, c.height).data;
    let l = c.width, t = c.height, r = -1, b = -1;
    for (let y = 0; y < c.height; y++) {
        for (let x = 0; x < c.width; x++) {
            if (d[(y * c.width + x) * 4 + 3] > 40) {
                if (x < l)
                    l = x;
                if (x > r)
                    r = x;
                if (y < t)
                    t = y;
                if (y > b)
                    b = y;
            }
        }
    }
    return r < 0 ? null : { x: l, y: t, w: r - l + 1, h: b - t + 1 };
};
const loadImage = (src) => new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null); // missing art is survivable — we fall back to a rect
    img.src = src;
});
const fetchJson = async (url) => {
    try {
        const r = await fetch(url);
        return r.ok ? (await r.json()) : null;
    }
    catch {
        return null;
    }
};
const listCharacters = async () => (await fetchJson('/api/characters')) ?? [];
const loadRoster = async (id) => {
    const bundle = await fetchJson(`/characters/${id}/character.json`);
    if (!bundle)
        throw new Error(`character "${id}" not found`);
    const [atlas, sheet, portrait] = await Promise.all([
        fetchJson(`/characters/${id}/sprites/atlas.json`),
        loadImage(`/characters/${id}/sprites/atlas.png`),
        loadImage(`/characters/${id}/sprites/_reference.png`),
    ]);
    return {
        id, bundle, ch: loadCharacter(bundle), atlas, sheet, portrait,
        portraitBox: portrait ? alphaBounds(portrait) : null,
    };
};
/**
 * Draw a fighter at world position (x, y = feet), mirrored by facing.
 * Falls back to a colored rectangle if the frame is missing, so a
 * half-authored character is still playable.
 */
const drawFighter = (ctx, roster, f, tick, x, y, fallback) => {
    const name = spriteForFighter(f, roster.ch, tick);
    const frame = name && roster.atlas ? roster.atlas.frames[name] : undefined;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(f.facing, 1);
    ctx.imageSmoothingEnabled = false;
    if (frame && roster.sheet) {
        ctx.drawImage(roster.sheet, frame.x, frame.y, frame.w, frame.h, -frame.pivotX, -frame.pivotY, frame.w, frame.h);
    }
    else {
        ctx.fillStyle = fallback;
        ctx.fillRect(-26, -108, 52, 108);
    }
    ctx.restore();
};
/**
 * Draw the reference art as a portrait: a square crop centered on the head and
 * chest of the actual figure (the reference cell is mostly empty space), scaled
 * to fill the frame.
 */
const drawPortrait = (ctx, roster, x, y, w, h) => {
    const img = roster.portrait;
    const box = roster.portraitBox;
    if (!img || !box) {
        ctx.fillStyle = '#1b1e30';
        ctx.fillRect(x, y, w, h);
        return;
    }
    // Square crop around the upper body, sized to the figure's width.
    const side = Math.max(box.w * 1.15, box.h * 0.55);
    const cropX = box.x + box.w / 2 - side / 2;
    const cropY = box.y - side * 0.05;
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y, w, h);
    ctx.clip();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, cropX, cropY, side, side, x, y, w, h);
    ctx.restore();
};

// ---- client/src/ui.js ----
/**
 * Arcade presentation layer: rooftop stage, framed HUD, title / select /
 * results screens. Pure drawing — zero game logic, zero sim reads beyond the
 * exported GameState fields. Everything is procedural (no art assets): the
 * only images in the game are the character sprites.
 */
const VW = STAGE.viewportW; // 960
const VH = STAGE.viewportH; // 540
// ---------------------------------------------------------------- palette
const GOLD = '#d9a441';
const GOLD_LT = '#f7e0a3';
const GOLD_DK = '#8a5f1e';
const PANEL = '#14121f';
const PANEL_LT = '#2a2438';
const HP_HI = '#7ee85a';
const HP_LO = '#3fa22c';
const HP_DANGER = '#e94560';
const METER_HI = '#6fd3ff';
const METER_FULL = '#ffd166';
const P_COLORS = ['#e94560', '#4ea8de'];
// ---------------------------------------------------------------- helpers
/** Beveled plate: the workhorse of the arcade frame look. */
const bevel = (ctx, x, y, w, h, fill, light = GOLD_LT, dark = GOLD_DK, t = 2) => {
    ctx.fillStyle = fill;
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = light;
    ctx.fillRect(x, y, w, t); // top
    ctx.fillRect(x, y, t, h); // left
    ctx.fillStyle = dark;
    ctx.fillRect(x, y + h - t, w, t); // bottom
    ctx.fillRect(x + w - t, y, t, h); // right
};
const text = (ctx, s, x, y, size, color, align = 'center', shadow = true) => {

    ctx.textAlign = align;

    }
    ctx.fillStyle = color;
    ctx.fillText(s, x, y);
};
// ---------------------------------------------------------------- stage
/** Rooftop at sunset: parallax skyline, fence, tiled deck. Camera-aware. */
const drawStage = (ctx, camX, camY) => {
    const sy = (v) => v + camY;
    // Sky.
    const sky = ctx.createLinearGradient(0, 0, 0, sy(STAGE.floorYPx));
    sky.addColorStop(0, '#2b1b4d');
    sky.addColorStop(0.45, '#6a2f6b');
    sky.addColorStop(0.78, '#c05a5a');
    sky.addColorStop(1, '#f0a35e');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, VW, sy(STAGE.floorYPx) + 2);
    // Sun.
    ctx.fillStyle = '#ffd9a0';
    ctx.beginPath();
    ctx.arc(VW * 0.62 - camX * 0.05, sy(330), 46, 0, Math.PI * 2);
    ctx.fill();
    // Far skyline (slow parallax).
    const far = (wx) => wx - camX * 0.25;
    ctx.fillStyle = '#3a2352';
    for (let i = 0; i < 26; i++) {
        const wx = i * 90;
        const bw = 54 + ((i * 37) % 40);
        const bh = 90 + ((i * 53) % 120);
        ctx.fillRect(far(wx), sy(STAGE.floorYPx - bh), bw, bh);
    }
    // Near skyline + lit windows.
    const near = (wx) => wx - camX * 0.5;
    for (let i = 0; i < 22; i++) {
        const wx = i * 110 + 30;
        const bw = 70 + ((i * 29) % 46);
        const bh = 140 + ((i * 71) % 130);
        const bx = near(wx);
        const by = sy(STAGE.floorYPx - bh);
        ctx.fillStyle = '#241638';
        ctx.fillRect(bx, by, bw, bh);
        ctx.fillStyle = '#ffcf7a44';
        for (let wy = by + 12; wy < by + bh - 10; wy += 22) {
            for (let wxx = bx + 8; wxx < bx + bw - 10; wxx += 18) {
                if ((wxx * 7 + wy * 13 + i) % 3 === 0)
                    ctx.fillRect(wxx, wy, 7, 10);
            }
        }
    }
    // Chain-link fence along the roof edge (world-locked).
    const fenceTop = sy(STAGE.floorYPx - 120);
    const fenceBot = sy(STAGE.floorYPx);
    ctx.strokeStyle = '#2a2438aa';
    ctx.lineWidth = 1;
    for (let wx = 0; wx < STAGE.widthPx; wx += 14) {
        const x = wx - camX;
        if (x < -20 || x > VW + 20)
            continue;
        ctx.beginPath();
        ctx.moveTo(x, fenceTop);
        ctx.lineTo(x + 14, fenceBot);
        ctx.moveTo(x + 14, fenceTop);
        ctx.lineTo(x, fenceBot);
        ctx.stroke();
    }
    ctx.strokeStyle = '#4a4260';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, fenceTop);
    ctx.lineTo(VW, fenceTop);
    ctx.stroke();
    // Fence posts.
    ctx.fillStyle = '#3a3450';
    for (let wx = 0; wx < STAGE.widthPx; wx += 180) {
        const x = wx - camX;
        if (x > -10 && x < VW + 10)
            ctx.fillRect(x, fenceTop, 6, fenceBot - fenceTop);
    }
    // Roof deck: tiles in perspective.
    const floorY = sy(STAGE.floorYPx);
    ctx.fillStyle = '#4a4358';
    ctx.fillRect(0, floorY, VW, VH - floorY + 40);
    ctx.fillStyle = '#3e384a';
    ctx.fillRect(0, floorY, VW, 6);
    // Receding seam lines.
    ctx.strokeStyle = '#5a5370';
    ctx.lineWidth = 1;
    for (let wx = -200; wx < STAGE.widthPx + 200; wx += 96) {
        const x = wx - camX;
        ctx.beginPath();
        ctx.moveTo(x, floorY + 6);
        ctx.lineTo(x - 70, VH + 40);
        ctx.stroke();
    }
    for (let k = 1; k < 5; k++) {
        const y = floorY + 6 + k * k * 8;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(VW, y);
        ctx.stroke();
    }
    // Puddles catching the sunset.
    ctx.fillStyle = '#c07a6a33';
    for (const [wx, wy, ww] of [[240, 40, 90], [900, 74, 130], [1420, 34, 70]]) {
        ctx.beginPath();
        ctx.ellipse(wx - camX, floorY + wy, ww / 2, 7, 0, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.lineWidth = 1;
};
// ---------------------------------------------------------------- HUD
/**
 * HUD layout (rows, top-down): health bar · nameplate · round pips · meter.
 * Kept as named constants so nothing silently overlaps when tuned.
 */
const HUD = {
    edge: 96, // inner edge of the bars (portraits live outside this)
    barW: 330,
    barH: 26,
    barY: 30,
    nameY: 64,
    nameH: 21,
    pipY: 92,
    pipS: 12,
    meterY: 110,
    meterH: 9,
};
const drawHealthBar = (ctx, i, ratio, flashRatio) => {
    const barW = HUD.barW, barH = HUD.barH;
    const x = i === 0 ? HUD.edge : VW - HUD.edge - barW;
    const y = HUD.barY;
    // Frame.
    bevel(ctx, x - 4, y - 4, barW + 8, barH + 8, '#3a3244', '#6f6480', '#1a1626', 2);
    bevel(ctx, x - 2, y - 2, barW + 4, barH + 4, PANEL, GOLD, GOLD_DK, 2);
    // Damage flash (recent damage drains behind the bar).
    const fw = Math.round(barW * Math.max(0, ratio));
    const flashW = Math.round(barW * Math.max(0, flashRatio));
    const barX = (w) => (i === 0 ? x + barW - w : x);
    ctx.fillStyle = '#ffffff55';
    ctx.fillRect(barX(flashW), y, flashW, barH);
    // Fill (drains toward the center of the screen, MvC style).
    const grad = ctx.createLinearGradient(0, y, 0, y + barH);
    const danger = ratio < 0.25;
    grad.addColorStop(0, danger ? HP_DANGER : HP_HI);
    grad.addColorStop(1, danger ? '#8a1f30' : HP_LO);
    ctx.fillStyle = grad;
    ctx.fillRect(barX(fw), y, fw, barH);
    // Gloss.
    ctx.fillStyle = '#ffffff33';
    ctx.fillRect(barX(fw), y + 2, fw, 5);
    // Arrow cap on the inner edge (reference art has angled bar tips).
    ctx.fillStyle = GOLD;
    const tip = i === 0 ? x + barW : x - 12;
    ctx.beginPath();
    if (i === 0) {
        ctx.moveTo(tip, y - 2);
        ctx.lineTo(tip + 12, y + barH / 2);
        ctx.lineTo(tip, y + barH + 2);
    }
    else {
        ctx.moveTo(tip + 12, y - 2);
        ctx.lineTo(tip, y + barH / 2);
        ctx.lineTo(tip + 12, y + barH + 2);
    }
    ctx.closePath();
    ctx.fill();
};
const drawMeter = (ctx, i, meter) => {
    const bars = Math.round(TUNING.meterMax / TUNING.meterBar);
    const gap = 5;
    const segW = Math.floor((HUD.barW - (bars - 1) * gap) / bars);
    const total = bars * segW + (bars - 1) * gap;
    const startX = i === 0 ? HUD.edge : VW - HUD.edge - total;
    const y = HUD.meterY;
    for (let b = 0; b < bars; b++) {
        const x = startX + b * (segW + gap);
        const seg = Math.max(0, Math.min(TUNING.meterBar, meter - b * TUNING.meterBar));
        const ratio = seg / TUNING.meterBar;
        bevel(ctx, x, y, segW, HUD.meterH, '#191524', '#4a4260', '#0d0a14', 1);
        const full = ratio >= 1;
        ctx.fillStyle = full ? METER_FULL : METER_HI;
        ctx.fillRect(x + 1, y + 1, Math.round((segW - 2) * ratio), HUD.meterH - 2);
    }
};
const drawPortraitFrame = (ctx, i, roster, lowHealth) => {

    const cell = 132, gap = 18;
    const cols = Math.min(rosters.length, 5);
    const gridW = cols * cell + (cols - 1) * gap;
    const gx = (VW - gridW) / 2;
    const gy = 110;
    rosters.forEach((r, k) => {
        const x = gx + (k % cols) * (cell + gap);
        const y = gy + Math.floor(k / cols) * (cell + gap + 26);
        bevel(ctx, x - 3, y - 3, cell + 6, cell + 6, PANEL, GOLD, GOLD_DK, 3);
        drawPortrait(ctx, r, x, y, cell, cell);
        text(ctx, r.bundle.name.toUpperCase(), x + cell / 2, y + cell + 20, 14, '#fff');
        // Selection cursors.
        for (const i of [0, 1]) {
            if (cursors[i] !== k)
                continue;
            const blink = locked[i] || tick % 30 < 20;
            if (!blink)
                continue;
            ctx.strokeStyle = P_COLORS[i];
            ctx.lineWidth = 4;
            const o = i === 0 ? 0 : 5; // offset so both cursors are visible on the same cell
            ctx.strokeRect(x - 6 - o, y - 6 - o, cell + 12 + o * 2, cell + 12 + o * 2);
            ctx.lineWidth = 1;
            ctx.fillStyle = P_COLORS[i];
            const tagX = i === 0 ? x - 6 : x + cell + 6;
            ctx.fillRect(tagX - (i === 0 ? 0 : 30), y - 26, 30, 18);
            text(ctx, locked[i] ? `P${i + 1}✓` : `P${i + 1}`, tagX + (i === 0 ? 15 : -15), y - 12, 12, '#fff', 'center', false);
        }
    });
    // Big preview of each player's pick.
    rosters.forEach((r, k) => {
        for (const i of [0, 1]) {
            if (cursors[i] !== k || !r.portrait)
                continue;
            ctx.save();
            ctx.globalAlpha = locked[i] ? 1 : 0.75;
            ctx.translate(i === 0 ? 120 : VW - 120, VH - 40);
            ctx.scale(i === 0 ? 1.15 : -1.15, 1.15);
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(r.portrait, -96, -176);
            ctx.restore();
        }
    });
    const bothLocked = locked[0] && locked[1];
    if (bothLocked) {
        if (tick % 60 < 42)
            text(ctx, 'PRESS START TO FIGHT', VW / 2, VH - 30, 20, GOLD_LT);
    }
    else {
        text(ctx, 'P1: A/D MOVE · F CONFIRM      P2: ←/→ MOVE · K CONFIRM', VW / 2, VH - 30, 13, '#ffffffaa');
    }
};
// ---------------------------------------------------------------- results
const drawResults = (ctx, g, rosters, tick) => {
    ctx.fillStyle = '#0a0616bb';
    ctx.fillRect(0, 0, VW, VH);
    const w = g.winner;
    const title = w === 2 ? 'DRAW GAME' : `${rosters[w].bundle.name.toUpperCase()} WINS`;
    bevel(ctx, VW / 2 - 300, VH / 2 - 80, 600, 120, PANEL, GOLD, GOLD_DK, 3);
    text(ctx, title, VW / 2, VH / 2 - 20, 44, GOLD_LT);
    text(ctx, `${g.roundsWon0} — ${g.roundsWon1}`, VW / 2, VH / 2 + 22, 24, '#fff');
    if (tick % 60 < 42) {
        text(ctx, 'ENTER: REMATCH    ESC: CHARACTER SELECT', VW / 2, VH / 2 + 90, 16, '#ffffffcc');
    }
};

// ---- client/src/main.js ----
/**
 * Agent Fighter — game client.
 * Fixed-timestep 60Hz loop; the renderer is a pure function of GameState plus
 * cosmetic juice that lives OUTSIDE the sim (safe under future rollback).
 * Characters are loaded from `characters/<id>/` bundles + packed atlases —
 * the client interprets no frame data, it only asks the engine which sprite
 * to draw (`spriteForFighter`) and blits it.
 */



const TICK_MS = 1000 / TICKS_PER_SEC;
// ---------------------------------------------------------------- input
const keys = new Set();
const pressedThisFrame = new Set();
addEventListener('keydown', (e) => {
    if (!keys.has(e.code))
        pressedThisFrame.add(e.code);
    keys.add(e.code);
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code))
        e.preventDefault();
});
addEventListener('keyup', (e) => keys.delete(e.code));
const P0_MAP = [
    ['KeyA', 1 /* Btn.Left */], ['KeyD', 2 /* Btn.Right */], ['KeyW', 4 /* Btn.Up */], ['KeyS', 8 /* Btn.Down */],
    ['KeyT', 16 /* Btn.LP */], ['KeyY', 32 /* Btn.MP */], ['KeyU', 64 /* Btn.HP */],
    ['KeyG', 128 /* Btn.LK */], ['KeyH', 256 /* Btn.MK */], ['KeyJ', 512 /* Btn.HK */],
];
const P1_MAP = [
    ['ArrowLeft', 1 /* Btn.Left */], ['ArrowRight', 2 /* Btn.Right */], ['ArrowUp', 4 /* Btn.Up */], ['ArrowDown', 8 /* Btn.Down */],
    ['KeyI', 16 /* Btn.LP */], ['KeyO', 32 /* Btn.MP */], ['KeyP', 64 /* Btn.HP */],
    ['KeyK', 128 /* Btn.LK */], ['KeyL', 256 /* Btn.MK */], ['Semicolon', 512 /* Btn.HK */],
    ['Numpad4', 16 /* Btn.LP */], ['Numpad5', 32 /* Btn.MP */], ['Numpad6', 64 /* Btn.HP */],
    ['Numpad1', 128 /* Btn.LK */], ['Numpad2', 256 /* Btn.MK */], ['Numpad3', 512 /* Btn.HK */],
];
const CONFIRM = [['KeyT', 'KeyY', 'KeyU', 'KeyG', 'KeyH', 'KeyJ'], ['KeyI', 'KeyO', 'KeyP', 'KeyK', 'KeyL', 'Semicolon']];
const pollPad = (map) => {
    let f = 0;
    for (const [code, bit] of map)
        if (keys.has(code))
            f |= bit;
    return f;
};
let screen = 'loading';
let uiTick = 0;
let allRosters = [];
let picks = [0, 0];
let locked = [false, false];
let fighters = null;
let game = null;
let showBoxes = false;
let seed = 1;
let loadError = '';
let sparks = [];
let shake = 0;
let camX = 0;
let camY = 0;
let hitStopFlash = 0;
const fx = { flash: [1, 1], comboOwner: -1, comboHits: 0, announce: '', announceAge: 0 };
let prevHealth = [0, 0];
let prevPhase = 0 /* Phase.PreRound */;
// ---------------------------------------------------------------- canvas
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const px = (v) => Math.trunc(v / 256);
// ---------------------------------------------------------------- boot
const boot = async () => {
    try {
        const ids = await listCharacters();
        if (ids.length === 0)
            throw new Error('no characters found in characters/');
        allRosters = await Promise.all(ids.map(loadRoster));
        picks = [0, Math.min(1, allRosters.length - 1)];
        screen = 'title';
    }
    catch (e) {
        loadError = e.message;
    }
};
const startFight = () => {
    fighters = [allRosters[picks[0]], allRosters[picks[1]]];
    setCharacters(fighters[0].ch, fighters[1].ch);
    game = createGameState(seed++);
    prevHealth = [game.fighters[0].health, game.fighters[1].health];
    prevPhase = game.phase;
    fx.flash = [1, 1];
    fx.comboOwner = -1;
    fx.comboHits = 0;
    fx.announce = `ROUND ${game.roundNum + 1}`;
    fx.announceAge = 0;
    sparks = [];
    shake = 0;
    screen = 'fight';
};
// ---------------------------------------------------------------- camera
const updateCamera = (g) => {
    const midX = (px(g.fighters[0].x) + px(g.fighters[1].x)) / 2;
    const targetX = Math.max(0, Math.min(STAGE.widthPx - VW, midX - VW / 2));
    const highest = Math.min(px(g.fighters[0].y), px(g.fighters[1].y));
    const targetY = Math.max(0, (STAGE.floorYPx - highest - 250) * 0.8);
    camX += (targetX - camX) * 0.16;
    camY += (targetY - camY) * 0.1;
};
// ---------------------------------------------------------------- juice
const updateJuice = (g) => {
    for (const i of [0, 1]) {
        const f = g.fighters[i];
        if (f.health < prevHealth[i]) {
            const dmg = prevHealth[i] - f.health;
            const big = dmg > 600;
            sparks.push({ x: px(f.x) + f.facing * -22, y: px(f.y) - 78, age: 0, big });
            shake = big ? 11 : 6;
            hitStopFlash = big ? 3 : 0;
        }
        prevHealth[i] = f.health;
        // Health bar lag (white flash draining behind the real bar).
        const max = fighters[i].ch.b.maxHealth;
        const target = Math.max(0, f.health) / max;
        fx.flash[i] = fx.flash[i] > target ? Math.max(target, fx.flash[i] - 0.006) : target;
    }
    // Combo counter tracks whoever is being hit.
    const v0 = g.fighters[0], v1 = g.fighters[1];
    const inCombo = (a) => a === 10 /* Action.Hitstun */ || a === 11 /* Action.AirHitstun */;
    if (inCombo(v1.action) && v1.comboHits >= 2) {
        fx.comboOwner = 0;
        fx.comboHits = v1.comboHits;
    }
    else if (inCombo(v0.action) && v0.comboHits >= 2) {
        fx.comboOwner = 1;
        fx.comboHits = v0.comboHits;
    }
    else if (!inCombo(v0.action) && !inCombo(v1.action))
        fx.comboOwner = -1;
    // Announcements on phase changes.
    if (g.phase !== prevPhase) {
        if (g.phase === 1 /* Phase.Fighting */) {
            fx.announce = 'FIGHT!';
            fx.announceAge = 0;
        }
        else if (g.phase === 2 /* Phase.RoundOver */) {
            fx.announce = g.roundWinner === 2 ? 'DOUBLE KO' : 'K.O.';
            fx.announceAge = 0;
        }
        else if (g.phase === 0 /* Phase.PreRound */) {
            fx.announce = `ROUND ${g.roundNum + 1}`;
            fx.announceAge = 0;
        }
        prevPhase = g.phase;
    }
    fx.announceAge++;
    sparks = sparks.filter((s) => ++s.age < 9);
    shake = Math.max(0, shake - 0.7);
    if (hitStopFlash > 0)
        hitStopFlash--;
};
// ---------------------------------------------------------------- render
const renderFight = (g) => {
    ctx.save();
    if (shake > 0)
        ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    drawStage(ctx, camX, camY);
    // Fighters (draw the one being hit last so it reads on top).
    const order = g.fighters[0].action === 10 /* Action.Hitstun */ ? [1, 0] : [0, 1];
    for (const i of order) {
        const f = g.fighters[i];
        // Ground shadow.
        ctx.fillStyle = '#00000055';
        ctx.beginPath();
        ctx.ellipse(px(f.x) - camX, STAGE.floorYPx + camY + 2, 26, 6, 0, 0, Math.PI * 2);
        ctx.fill();
        drawFighter(ctx, fighters[i], f, g.tick, px(f.x) - camX, px(f.y) + camY, P_COLORS[i]);
    }
    // Projectiles.
    for (const p of g.projectiles) {
        if (!p.active)
            continue;
        const x = px(p.x) - camX;
        const y = px(p.y) + camY;
        const grd = ctx.createRadialGradient(x, y, 2, x, y, 20);
        grd.addColorStop(0, '#ffffff');
        grd.addColorStop(0.5, P_COLORS[p.owner]);
        grd.addColorStop(1, '#ffffff00');
        ctx.fillStyle = grd;
        ctx.beginPath();
        ctx.arc(x, y, 20, 0, Math.PI * 2);
        ctx.fill();
    }
    // Super flash.
    if (g.superFlashLeft > 0) {
        ctx.fillStyle = g.superFlashLeft % 4 < 2 ? '#ffffff22' : '#000018aa';
        ctx.fillRect(0, 0, VW, VH);
    }
    // Impact flash.
    if (hitStopFlash > 0) {
        ctx.fillStyle = '#ffffff33';
        ctx.fillRect(0, 0, VW, VH);
    }
    // Hit sparks.
    for (const s of sparks) {
        const r = (s.big ? 10 : 5) + s.age * (s.big ? 6 : 3.5);
        ctx.strokeStyle = `rgba(255, 224, 130, ${1 - s.age / 9})`;
        ctx.lineWidth = s.big ? 5 : 3;
        ctx.beginPath();
        ctx.arc(s.x - camX, s.y + camY, r, 0, Math.PI * 2);
        ctx.stroke();
    }
    ctx.lineWidth = 1;
    // Debug boxes.
    if (showBoxes) {
        for (const b of debugBoxes(g)) {
            ctx.strokeStyle = '#4ade80';
            for (const r of b.hurtboxes)
                ctx.strokeRect(r.x - camX + 0.5, r.y + camY + 0.5, r.w, r.h);
            ctx.strokeStyle = '#f87171';
            for (const r of b.hitboxes)
                ctx.strokeRect(r.x - camX + 0.5, r.y + camY + 0.5, r.w, r.h);
        }
    }
    ctx.restore();
    drawHud(ctx, g, fighters, fx);
};
// ---------------------------------------------------------------- screens
const tickSelect = () => {
    const n = allRosters.length;
    const move = (i, d) => {
        if (locked[i])
            return;
        picks[i] = (picks[i] + d + n) % n;
    };
    if (pressedThisFrame.has('KeyA'))
        move(0, -1);
    if (pressedThisFrame.has('KeyD'))
        move(0, 1);
    if (pressedThisFrame.has('ArrowLeft'))
        move(1, -1);
    if (pressedThisFrame.has('ArrowRight'))
        move(1, 1);
    for (const i of [0, 1]) {
        if (CONFIRM[i].some((k) => pressedThisFrame.has(k)))
            locked[i] = true;
    }
    if (pressedThisFrame.has('Escape'))
        locked = [false, false];
    if (locked[0] && locked[1] && (pressedThisFrame.has('Enter') || pressedThisFrame.has('Space'))) {
        startFight();
    }
};
const frame = () => {
    uiTick++;
    if (screen === 'loading') {
        ctx.fillStyle = '#0a0616';
        ctx.fillRect(0, 0, VW, VH);
        ctx.fillStyle = loadError ? '#e94560' : '#ffffffaa';
        ctx.font = 'bold 18px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(loadError || 'LOADING CHARACTERS…', VW / 2, VH / 2);
        if (loadError) {
            ctx.font = '13px "Courier New", monospace';
            ctx.fillStyle = '#ffffff88';
            ctx.fillText('run `npm run play` from the repo root so characters/ is served', VW / 2, VH / 2 + 28);
        }
    }
    else if (screen === 'title') {
        drawTitle(ctx, allRosters, uiTick);
        if (pressedThisFrame.size > 0) {
            screen = 'select';
            locked = [false, false];
        }
    }
    else if (screen === 'select') {
        tickSelect();
        drawSelect(ctx, allRosters, picks, locked, uiTick);
    }
    else if (screen === 'fight' && game) {
        if (pressedThisFrame.has('KeyB'))
            showBoxes = !showBoxes;
        if (pressedThisFrame.has('Escape')) {
            screen = 'select';
            locked = [false, false];
        }
        step(game, [pollPad(P0_MAP), pollPad(P1_MAP)]);
        updateJuice(game);
        updateCamera(game);
        renderFight(game);
        if (game.phase === 3 /* Phase.MatchOver */)
            screen = 'results';
    }
    else if (screen === 'results' && game) {
        renderFight(game);
        drawResults(ctx, game, fighters, uiTick);
        if (pressedThisFrame.has('Enter'))
            startFight();
        if (pressedThisFrame.has('Escape')) {
            screen = 'select';
            locked = [false, false];
        }
    }
    pressedThisFrame.clear();
};
// ---------------------------------------------------------------- loop
let last = performance.now();
let acc = 0;
const loop = (now) => {
    acc = Math.min(acc + (now - last), 200); // tab-switch guard
    last = now;
    let ran = false;
    while (acc >= TICK_MS) {
        frame();
        acc -= TICK_MS;
        ran = true;
    }
    if (!ran && screen === 'loading')
        frame(); // keep the loading screen painted
    requestAnimationFrame(loop);
};
void boot();
requestAnimationFrame(loop);
/**
 * Console/automation hooks. `afStep(n)` advances exactly n frames without
 * rAF — the hook automated visual tests and headless screenshots drive
 * (browsers throttle rAF to zero in hidden tabs). Replay export lands here
 * later; the input log is already the full match record.
 */
Object.assign(globalThis, {
    afGame: () => game,
    afRosters: () => allRosters,
    afScreen: () => screen,
    afStep: (n = 1) => { for (let k = 0; k < n; k++)
        frame(); },
    afPress: (code) => { pressedThisFrame.add(code); keys.add(code); },
    afRelease: (code) => { keys.delete(code); },
});
</script>
